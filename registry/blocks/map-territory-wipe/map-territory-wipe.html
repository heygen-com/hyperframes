<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: #1a1714;
        overflow: hidden;
      }
      #root-map-territory-wipe {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #1a1714;
        font-family: Georgia, "Times New Roman", serif;
      }
      #mtw-frame {
        position: absolute;
        inset: 48px;
        border: 1px solid rgba(196, 181, 154, 0.14);
        background: #221e19;
      }
      #mtw-svg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      #mtw-title {
        position: absolute;
        top: 72px;
        left: 96px;
        color: rgba(232, 220, 196, 0.92);
        font-size: 42px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      #mtw-subtitle {
        position: absolute;
        top: 128px;
        left: 96px;
        color: rgba(196, 181, 154, 0.55);
        font-size: 22px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }
      #mtw-badge {
        position: absolute;
        bottom: 96px;
        right: 120px;
        padding: 14px 28px;
        border: 1px solid rgba(196, 181, 154, 0.28);
        color: rgba(232, 220, 196, 0.9);
        font-size: 20px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        background: rgba(26, 23, 20, 0.55);
      }
    </style>
  </head>
  <body>
    <div
      id="root-map-territory-wipe"
      data-composition-id="map-territory-wipe"
      data-start="0"
      data-duration="8"
      data-width="1920"
      data-height="1080"
    >
      <div id="mtw-frame">
        <svg
          id="mtw-svg"
          viewBox="0 0 1920 1080"
          xmlns="http://www.w3.org/2000/svg"
          aria-hidden="true"
        >
          <defs>
            <clipPath id="mtw-wipe-clip">
              <rect id="mtw-wipe-rect" x="640" y="300" width="0" height="480" />
            </clipPath>
            <pattern
              id="mtw-hatch"
              width="10"
              height="10"
              patternUnits="userSpaceOnUse"
              patternTransform="rotate(40)"
            >
              <line x1="0" y1="0" x2="0" y2="10" stroke="rgba(196,181,154,0.07)" stroke-width="1" />
            </pattern>
          </defs>
          <rect width="1920" height="1080" fill="#1f1b17" />
          <rect width="1920" height="1080" fill="url(#mtw-hatch)" />
          <path
            id="mtw-land"
            d="M 280 320 C 340 220 480 180 620 210 C 760 240 820 300 900 280 C 980 260 1080 300 1180 340 C 1280 380 1360 460 1380 560 C 1400 660 1340 760 1240 820 C 1140 880 980 900 860 860 C 740 820 700 780 620 800 C 540 820 420 780 360 700 C 300 620 240 500 280 320 Z"
            fill="rgba(196,181,154,0.16)"
            stroke="rgba(196,181,154,0.4)"
            stroke-width="2"
          />
          <path
            id="mtw-island"
            d="M 1480 420 C 1540 400 1600 430 1610 480 C 1620 530 1580 570 1520 560 C 1460 550 1450 450 1480 420 Z"
            fill="rgba(196,181,154,0.12)"
            stroke="rgba(196,181,154,0.3)"
            stroke-width="1.5"
          />
          <!-- territory under clip -->
          <path
            id="mtw-territory"
            d="M 720 380 C 860 340 980 360 1060 420 C 1140 480 1160 580 1080 640 C 1000 700 860 720 760 680 C 660 640 640 540 680 460 C 700 420 700 400 720 380 Z"
            fill="#c45c26"
            fill-opacity="0.55"
            stroke="#c45c26"
            stroke-width="2.5"
            clip-path="url(#mtw-wipe-clip)"
          />
          <path
            id="mtw-territory-outline"
            d="M 720 380 C 860 340 980 360 1060 420 C 1140 480 1160 580 1080 640 C 1000 700 860 720 760 680 C 660 640 640 540 680 460 C 700 420 700 400 720 380 Z"
            fill="none"
            stroke="rgba(196,181,154,0.35)"
            stroke-width="1.5"
            stroke-dasharray="6 6"
          />
          <text
            id="mtw-region-label"
            x="900"
            y="520"
            text-anchor="middle"
            fill="rgba(232,220,196,0.95)"
            font-size="28"
            font-family="Georgia, serif"
            letter-spacing="0.12em"
            opacity="0"
          >
            REGION
          </text>
        </svg>
      </div>
      <div id="mtw-title" data-var-text="title">Territory Revealed</div>
      <div id="mtw-subtitle" data-var-text="subtitle">Wipe fill · educational cartography</div>
      <div id="mtw-badge" data-var-text="regionLabel">Region A</div>
    </div>
    <script>
      (function () {
        window.__timelines = window.__timelines || {};
        var vars =
          window.__hyperframes && window.__hyperframes.getVariables
            ? window.__hyperframes.getVariables()
            : {};
        var accent = /^#[0-9a-fA-F]{6}$/.test(String(vars.accent || ""))
          ? String(vars.accent)
          : "#c45c26";
        var title =
          typeof vars.title === "string" && vars.title ? vars.title : "Territory Revealed";
        var subtitle =
          typeof vars.subtitle === "string" && vars.subtitle
            ? vars.subtitle
            : "Wipe fill · educational cartography";
        var regionLabel =
          typeof vars.regionLabel === "string" && vars.regionLabel ? vars.regionLabel : "Region A";

        document.getElementById("mtw-title").textContent = title;
        document.getElementById("mtw-subtitle").textContent = subtitle;
        document.getElementById("mtw-badge").textContent = regionLabel;
        document.getElementById("mtw-region-label").textContent = regionLabel.toUpperCase();

        var terr = document.getElementById("mtw-territory");
        terr.setAttribute("fill", accent);
        terr.setAttribute("stroke", accent);

        var wipe = document.getElementById("mtw-wipe-rect");
        gsap.set("#mtw-title", { opacity: 0, y: -10 });
        gsap.set("#mtw-subtitle", { opacity: 0 });
        gsap.set("#mtw-badge", { opacity: 0, y: 10 });
        gsap.set("#mtw-land", { opacity: 0 });
        gsap.set("#mtw-island", { opacity: 0 });
        gsap.set("#mtw-territory-outline", { opacity: 0 });
        gsap.set("#mtw-region-label", { opacity: 0 });
        gsap.set(wipe, { attr: { width: 0 } });

        var tl = gsap.timeline({ paused: true });
        tl.to("#mtw-land", { opacity: 1, duration: 0.5, ease: "power2.out" }, 0);
        tl.to("#mtw-island", { opacity: 1, duration: 0.4, ease: "power2.out" }, 0.12);
        tl.to("#mtw-title", { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, 0.08);
        tl.to("#mtw-subtitle", { opacity: 1, duration: 0.35, ease: "power1.out" }, 0.3);
        tl.to("#mtw-territory-outline", { opacity: 1, duration: 0.4, ease: "power1.out" }, 0.7);
        // Horizontal wipe reveal via clip rect width
        tl.to(wipe, { attr: { width: 560 }, duration: 2.6, ease: "power2.inOut" }, 1.2);
        tl.to("#mtw-region-label", { opacity: 1, duration: 0.4, ease: "power1.out" }, 3.5);
        tl.to("#mtw-badge", { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, 3.7);
        // Soft pulse settle on territory opacity
        tl.to(terr, { fillOpacity: 0.7, duration: 0.6, ease: "sine.inOut" }, 4.2);
        tl.to(terr, { fillOpacity: 0.55, duration: 0.6, ease: "sine.inOut" }, 4.8);

        window.__timelines["map-territory-wipe"] = tl;
      })();
    </script>
  </body>
</html>
