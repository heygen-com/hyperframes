<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>World Map</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=block"
      rel="stylesheet"
    />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #0f172a;
      }

      #world-map {
        position: relative;
        width: 1920px;
        height: 1080px;
        background: linear-gradient(145deg, #0f172a 0%, #1e293b 100%);
        font-family: "Inter", sans-serif;
        color: #f0fdfa;
        overflow: hidden;
      }

      #world-map .headline {
        position: absolute;
        top: 48px;
        left: 80px;
        font-size: 52px;
        font-weight: 700;
        letter-spacing: -0.02em;
        color: #f0fdfa;
        clip-path: inset(0 100% 0 0);
      }

      #world-map .subtitle {
        position: absolute;
        top: 114px;
        left: 80px;
        font-size: 22px;
        font-weight: 300;
        color: #94a3b8;
        opacity: 0;
      }

      #world-map .map-container {
        position: absolute;
        top: 170px;
        left: 80px;
        width: 1380px;
        height: 700px;
      }

      #world-map .map-container svg {
        width: 1380px;
        height: 700px;
      }

      #world-map .country-path {
        stroke: #1e293b;
        stroke-width: 0.6;
        opacity: 0;
        cursor: default;
      }

      #world-map .ocean {
        fill: none;
      }

      #world-map .graticule {
        fill: none;
        stroke: #1e293b;
        stroke-width: 0.3;
        stroke-opacity: 0.4;
      }

      #world-map .legend-group {
        position: absolute;
        bottom: 80px;
        right: 80px;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 8px;
        opacity: 0;
      }

      #world-map .legend-bar {
        width: 280px;
        height: 14px;
        border-radius: 7px;
      }

      #world-map .legend-labels {
        display: flex;
        justify-content: space-between;
        width: 280px;
        font-size: 13px;
        font-weight: 500;
        color: #94a3b8;
      }

      #world-map .source {
        position: absolute;
        bottom: 36px;
        left: 80px;
        font-size: 13px;
        font-weight: 400;
        color: #475569;
        opacity: 0;
      }

      #world-map .tooltip {
        position: absolute;
        pointer-events: none;
        background: rgba(15, 23, 42, 0.92);
        border: 1px solid #334155;
        border-radius: 8px;
        padding: 10px 16px;
        font-size: 14px;
        font-weight: 500;
        color: #f0fdfa;
        white-space: nowrap;
        opacity: 0;
        transform: translateY(4px);
        backdrop-filter: blur(8px);
        z-index: 10;
      }

      #world-map .tooltip .tt-value {
        color: #22d3ee;
        font-weight: 600;
        margin-left: 6px;
      }
    </style>
  </head>

        /* ── Build the map ── */
        var svg = d3
          .select("#world-map-svg")
          .attr("viewBox", "0 0 1380 700")
          .attr("preserveAspectRatio", "xMidYMid meet");

        /* The projection the geometry was baked with — reused for the graticule. */
        var projection = d3
          .geoNaturalEarth1()
          .scale(MAP_GEOMETRY.projection.scale)
          .translate(MAP_GEOMETRY.projection.translate);

        var pathGenerator = d3.geoPath().projection(projection);

        /* Graticule */
        var graticule = d3.geoGraticule10();
        svg.append("path").datum(graticule).attr("class", "graticule").attr("d", pathGenerator);

        /* Tooltip element */
        var tooltipEl = document.querySelector("#world-map .tooltip");

        /* Render countries from the baked geometry */
        svg
          .selectAll(".country-path")
          .data(MAP_GEOMETRY.features)
          .enter()
          .append("path")
          .attr("class", "country-path")
          .attr("d", function (d) {
            return d.d;
          })
          .attr("data-country", function (d) {
            return d.id;
          })
          .attr("fill", function (d) {
            var code = d.id;
            if (gdpData[code]) {
              return gdpToColor(gdpData[code].gdp);
            }
            return defaultFill;
          })
          .on("mouseenter", function (event, d) {
            var code = d.id;
            if (gdpData[code]) {
              var entry = gdpData[code];
              tooltipEl.innerHTML =
                entry.name + '<span class="tt-value">$' + entry.gdp.toLocaleString() + "</span>";
              tooltipEl.style.opacity = "1";
              tooltipEl.style.transform = "translateY(0)";
            }
          })
          .on("mousemove", function (event) {
            var container = document.querySelector("#world-map");
            var rect = container.getBoundingClientRect();
            var x = event.clientX - rect.left + 16;
            var y = event.clientY - rect.top - 40;
            tooltipEl.style.left = x + "px";
            tooltipEl.style.top = y + "px";
          })
          .on("mouseleave", function () {
            tooltipEl.style.opacity = "0";
            tooltipEl.style.transform = "translateY(4px)";
          });

        /* ── GSAP Timeline ── */
        buildTimeline();

        function buildTimeline() {
          var tl = gsap.timeline({ paused: true });

          /* 0s: Headline clip-path wipe reveal (1s) */
          tl.to(
            "#world-map .headline",
            {
              clipPath: "inset(0 0% 0 0)",
              duration: 1,
              ease: "power3.inOut",
            },
            0,
          );

          /* 0.4s: Subtitle fade in (0.6s) */
          tl.to(
            "#world-map .subtitle",
            {
              opacity: 1,
              duration: 0.6,
              ease: "power2.out",
            },
            0.4,
          );

          /* 1.0s: Countries stagger reveal */
          tl.to(
            "#world-map .country-path",
            {
              opacity: 1,
              duration: 0.3,
              stagger: {
                each: 0.02,
                from: "center",
              },
              ease: "power1.out",
            },
            1.0,
          );

          /* 4.0s: Legend fade in */
          tl.to(
            "#world-map .legend-group",
            {
              opacity: 1,
              duration: 0.6,
              ease: "power2.out",
            },
            4.0,
          );

          /* 4.5s: Source fade in */
          tl.to(
            "#world-map .source",
            {
              opacity: 1,
              duration: 0.5,
              ease: "power2.out",
            },
            4.5,
          );

          /* 5.0s: Highlight pulse on top 5 GDP countries */
          for (var i = 0; i < top5Codes.length; i++) {
            var selector = '#world-map [data-country="' + top5Codes[i] + '"]';

            /* Pulse up: brightness + white stroke */
            tl.to(
              selector,
              {
                filter: "brightness(1.5)",
                stroke: "#ffffff",
                strokeWidth: 1.8,
                duration: 0.4,
                ease: "power2.out",
              },
              5.0 + i * 0.15,
            );

            /* Pulse back to normal */
            tl.to(
              selector,
              {
                filter: "brightness(1)",
                stroke: "#1e293b",
                strokeWidth: 0.6,
                duration: 0.6,
                ease: "power2.inOut",
              },
              5.0 + i * 0.15 + 0.4,
            );
          }

          /* Register timeline */
          if (!window.__timelines) {
            window.__timelines = {};
          }
          window.__timelines["world-map"] = tl;
        }
      })();
    </script>
  </body>
</html>
