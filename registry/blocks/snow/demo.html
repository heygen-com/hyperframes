<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body,
      #snow-demo {
        width: 1920px;
        height: 1080px;
        margin: 0;
        overflow: hidden;
      }

      #snow-demo-backdrop,
      #snow-demo-overlay {
        position: absolute;
        inset: 0;
      }

      #snow-demo-backdrop {
        background: linear-gradient(
          180deg,
          #252f3c 0%,
          #2f3b4b 35%,
          #455367 60%,
          #63728a 72%,
          #7a8aa0 78%
        );
      }

      #snow-demo-backdrop svg {
        position: absolute;
        inset: 0;
      }

      #snow-demo-title {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        color: #fff;
        font-family: Inter, system-ui, sans-serif;
        text-align: center;
      }

      #snow-demo-title h1 {
        margin: 0;
        font-size: 128px;
        font-weight: 600;
        letter-spacing: -0.03em;
        line-height: 1;
      }

      #snow-demo-title p {
        margin: 0;
        font-size: 36px;
        font-weight: 400;
        color: rgba(255, 255, 255, 0.78);
      }
    </style>
  </head>
  <body>
    <div
      id="snow-demo"
      data-composition-id="snow-demo"
      data-start="0"
      data-duration="6"
      data-width="1920"
      data-height="1080"
    >
      <div
        id="snow-demo-backdrop"
        class="clip"
        data-start="0"
        data-duration="6"
        data-track-index="0"
      >
        <svg viewBox="0 0 1920 1080" preserveAspectRatio="none" aria-hidden="true">
          <path
            fill="#8394aa"
            d="M0 830 L140 770 L260 798 L420 702 L520 746 L640 676 L790 760 L900 734 L1040 660 L1180 738 L1300 710 L1450 770 L1580 696 L1720 754 L1840 722 L1920 746 L1920 1080 L0 1080 Z"
          />
          <path
            fill="#4f5e73"
            d="M0 840 L180 792 L330 826 L520 770 L700 830 L880 788 L1060 840 L1240 782 L1420 826 L1600 776 L1780 820 L1920 798 L1920 1080 L0 1080 Z"
          />
          <path id="snow-demo-trees-far" fill="#1b2532" />
          <path id="snow-demo-trees-near" fill="#0c1118" />
        </svg>
        <div id="snow-demo-title">
          <h1>Winter release</h1>
          <p>Offline sync, shared folders and a faster search.</p>
        </div>
      </div>
      <div
        id="snow-demo-overlay"
        data-composition-id="snow"
        data-composition-src="snow.html"
        data-variable-values='{"density":"dense"}'
        data-start="0"
        data-duration="6"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};

      // Seeded pine treelines: same silhouette on every load.
      (function () {
        function rnd(n) {
          var x = Math.sin(n * 127.1 + 311.7) * 43758.5453;
          return x - Math.floor(x);
        }
        function pine(x, base, h) {
          var w = h * 0.3;
          var tiers = [
            [0, 1],
            [0.45, 0.62],
            [0.25, 0.62],
            [0.75, 0.3],
            [0.5, 0.3],
            [1, 0],
          ];
          var right = tiers.map(function (t) {
            return x + w * t[0] + " " + (base - h * t[1]);
          });
          var left = tiers
            .slice(1)
            .reverse()
            .map(function (t) {
              return x - w * t[0] + " " + (base - h * t[1]);
            });
          return "M" + right.concat(left).join(" L") + " Z";
        }
        function row(id, base, minH, maxH, step, seed) {
          var d = "M0 " + base + " L1920 " + base + " L1920 1080 L0 1080 Z";
          for (var x = -20, i = 0; x < 1960; i++) {
            d += pine(x, base + rnd(seed + i) * 14, minH + rnd(seed + i + 500) * (maxH - minH));
            x += step * (0.6 + rnd(seed + i + 900) * 0.8);
          }
          document.getElementById(id).setAttribute("d", d);
        }
        row("snow-demo-trees-far", 842, 46, 96, 30, 11);
        row("snow-demo-trees-near", 1010, 130, 280, 70, 71);
      })();

      var tl = gsap.timeline({ paused: true });
      tl.to({}, { duration: 6, ease: "none" }, 0);
      window.__timelines["snow-demo"] = tl;
    </script>
  </body>
</html>
