<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body,
      #starfield-demo {
        width: 1920px;
        height: 1080px;
        margin: 0;
        overflow: hidden;
      }

      #starfield-demo-backdrop {
        position: absolute;
        inset: 0;
        opacity: 0.94;
        background: radial-gradient(ellipse at 50% 120%, #16233d 0%, #050810 62%, #020308 100%);
      }

      #starfield-demo-overlay {
        position: absolute;
        inset: 0;
      }
    </style>
  </head>
  <body>
    <div
      id="starfield-demo"
      data-composition-id="starfield-demo"
      data-start="0"
      data-duration="6"
      data-width="1920"
      data-height="1080"
    >
      <div
        id="starfield-demo-backdrop"
        class="clip"
        data-start="0"
        data-duration="6"
        data-track-index="0"
      ></div>
      <div
        id="starfield-demo-overlay"
        data-composition-id="starfield"
        data-composition-src="starfield.html"
        data-start="0"
        data-duration="6"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });
      tl.to({}, { duration: 6, ease: "none" }, 0);
      window.__timelines["starfield-demo"] = tl;
    </script>
  </body>
</html>
