<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Effect Grid - Demo</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body,
      #eg-demo {
        width: 1920px;
        height: 1080px;
        margin: 0;
        overflow: hidden;
        background: #0a0a0a;
      }

      #eg-demo-frame,
      #eg-demo-grid {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }

      #eg-demo-frame {
        object-fit: cover;
      }
    </style>
  </head>
  <body>
    <div
      id="eg-demo"
      data-composition-id="effect-grid-demo"
      data-start="0"
      data-duration="6"
      data-width="1920"
      data-height="1080"
    >
      <img
        id="eg-demo-frame"
        class="clip"
        src="demo-frame.jpg"
        data-start="0"
        data-duration="6"
        data-track-index="0"
        alt=""
      />
      <div
        id="eg-demo-grid"
        data-composition-id="effect-grid"
        data-composition-src="effect-grid.html"
        data-start="0"
        data-duration="6"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
        data-variable-values='{"frameSrc":"demo-frame.jpg"}'
      ></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.to("#eg-demo-frame", { opacity: 1, duration: 0.1 }, 0);
      window.__timelines["effect-grid-demo"] = tl;
    </script>
  </body>
</html>
