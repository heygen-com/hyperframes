<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Number Wheel - Demo</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }
      #demo {
        width: 1920px;
        height: 1080px;
        display: grid;
        place-items: center;
        background: #071b16;
        color: #ecfff8;
        font-family: Inter, system-ui, sans-serif;
      }
      .metric {
        text-align: center;
        /* ponytail: zoom scales the non-animated wrapper; GSAP owns .label and .hf-number-wheel-strip transforms */
        zoom: 2.8;
      }
      .label {
        color: #68d8b5;
        font-size: 38px;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.1em;
      }
      .hf-number-wheel {
        margin-top: 36px;
        display: inline-flex;
        align-items: baseline;
        gap: 0.02em;
        font-size: 172px;
        font-weight: 900;
        font-variant-numeric: tabular-nums;
      }
      .hf-number-wheel-digit {
        display: inline-block;
        height: 1em;
        overflow: hidden;
      }
      .hf-number-wheel-strip {
        display: grid;
        transform: translateY(0em);
        will-change: transform;
      }
      .hf-number-wheel-strip span {
        height: 1em;
        line-height: 1em;
      }
    </style>
  </head>
  <body>
    <div
      id="demo"
      data-composition-id="number-wheel-demo"
      data-width="1920"
      data-height="1080"
      data-duration="5"
      data-composition-variables='[
    { "id": "spin", "type": "enum", "role": "motion", "label": "Spin", "description": "How many full 0 to 9 revolutions each column adds before it lands, which is how far the reel travels in the same time.", "default": "single", "options": [{ "value": "single", "label": "Single" }, { "value": "double", "label": "Double" }, { "value": "triple", "label": "Triple" }] },
    { "id": "spacing", "type": "enum", "role": "layout", "label": "Spacing", "description": "Gap between the digit columns.", "default": "standard", "options": [{ "value": "tight", "label": "Tight" }, { "value": "standard", "label": "Standard" }, { "value": "wide", "label": "Wide" }] },
    { "id": "tone", "type": "enum", "role": "style", "label": "Tone", "description": "Digit colour: inherit keeps the surrounding text colour, ink suits light frames, paper suits dark ones, accent rides --brand.", "default": "inherit", "options": [{ "value": "inherit", "label": "Inherit" }, { "value": "ink", "label": "Ink" }, { "value": "paper", "label": "Paper" }, { "value": "accent", "label": "Accent" }] }
  ]'
    >
      <div class="metric">
        <div class="label">GitHub stars</div>
        <span class="hf-number-wheel" data-value="30222"></span>
      </div>
      <script>
        (function () {
          const vars =
            window.__hyperframes && window.__hyperframes.getVariables
              ? window.__hyperframes.getVariables()
              : {};

          // Unrecognised overrides return to their declared defaults.
          const spins = { single: 0, double: 1, triple: 2 };
          const gaps = { tight: "0em", standard: "0.02em", wide: "0.14em" };
          const tones = {
            inherit: "inherit",
            ink: "#18181b",
            paper: "#fafafa",
            accent: "var(--brand, #34d399)",
          };
          const pick = (table, value, fallback) =>
            Object.prototype.hasOwnProperty.call(table, value) ? table[value] : table[fallback];

          const cycles = pick(spins, vars.spin, "single");
          const gap = pick(gaps, vars.spacing, "standard");
          const tone = pick(tones, vars.tone, "inherit");

          document.querySelectorAll(".hf-number-wheel").forEach((el) => {
            if (el.dataset.hfNumberWheelReady === "1") return;
            el.style.setProperty("--hf-wheel-gap", gap);
            el.style.setProperty("--hf-wheel-color", tone);
            const value = el.dataset.value || "0";
            el.textContent = "";
            for (const char of value) {
              if (!/\d/.test(char)) {
                el.append(document.createTextNode(char));
                continue;
              }
              const stops = cycles * 10 + Number(char);
              const frame = document.createElement("span");
              frame.className = "hf-number-wheel-digit";
              const strip = document.createElement("span");
              strip.className = "hf-number-wheel-strip";
              strip.style.setProperty("--hf-number-target-y", `${-stops}em`);
              for (let i = 0; i <= stops; i++) {
                const step = document.createElement("span");
                step.textContent = String(i % 10);
                strip.appendChild(step);
              }
              frame.appendChild(strip);
              el.appendChild(frame);
            }
            el.dataset.hfNumberWheelReady = "1";
          });
        })();
      </script>
      <script>
        document.querySelectorAll(".hf-number-wheel").forEach((el) => {
          const value = el.dataset.value || "0";
          el.textContent = "";
          for (const char of value) {
            if (!/\d/.test(char)) {
              el.append(document.createTextNode(char));
              continue;
            }
            const digit = Number(char);
            const frame = document.createElement("span");
            frame.className = "hf-number-wheel-digit";
            const strip = document.createElement("span");
            strip.className = "hf-number-wheel-strip";
            strip.style.setProperty("--hf-number-target-y", `${-digit}em`);
            for (let i = 0; i <= digit; i++) {
              const step = document.createElement("span");
              step.textContent = String(i);
              strip.appendChild(step);
            }
            frame.appendChild(strip);
            el.appendChild(frame);
          }
        });
        const tl = gsap.timeline({ paused: true });
        tl.from(".label", { opacity: 0, y: 18, duration: 0.5, ease: "power3.out" }, 0.2);
        tl.to(
          ".hf-number-wheel-strip",
          {
            y: (_, strip) => strip.style.getPropertyValue("--hf-number-target-y"),
            duration: 1.2,
            ease: "power3.out",
            stagger: 0.06,
          },
          0.65,
        );
        window.__timelines = window.__timelines || {};
        window.__timelines["number-wheel-demo"] = tl;
      </script>
    </div>
    <style
      data-composition-variables='[
    { "id": "spin", "type": "enum", "role": "motion", "label": "Spin", "description": "How many full 0 to 9 revolutions each column adds before it lands, which is how far the reel travels in the same time.", "default": "single", "options": [{ "value": "single", "label": "Single" }, { "value": "double", "label": "Double" }, { "value": "triple", "label": "Triple" }] },
    { "id": "spacing", "type": "enum", "role": "layout", "label": "Spacing", "description": "Gap between the digit columns.", "default": "standard", "options": [{ "value": "tight", "label": "Tight" }, { "value": "standard", "label": "Standard" }, { "value": "wide", "label": "Wide" }] },
    { "id": "tone", "type": "enum", "role": "style", "label": "Tone", "description": "Digit colour: inherit keeps the surrounding text colour, ink suits light frames, paper suits dark ones, accent rides --brand.", "default": "inherit", "options": [{ "value": "inherit", "label": "Inherit" }, { "value": "ink", "label": "Ink" }, { "value": "paper", "label": "Paper" }, { "value": "accent", "label": "Accent" }] }
  ]'
    >
      .hf-number-wheel {
        display: inline-flex;
        align-items: baseline;
        gap: var(--hf-wheel-gap, 0.02em);
        color: var(--hf-wheel-color, inherit);
        font-variant-numeric: tabular-nums;
      }
      .hf-number-wheel-digit {
        display: inline-block;
        height: 1em;
        overflow: hidden;
      }
      .hf-number-wheel-strip {
        display: grid;
        transform: translateY(0em);
        will-change: transform;
      }
      .hf-number-wheel-strip span {
        height: 1em;
        line-height: 1em;
      }
    </style>
  </body>
</html>
