<!--
  Dropdown Menu - compact menu primitive.

  Animate --hf-dropdown-open from 0 to 1 on .hf-ui-dropdown.
  Use --hf-dropdown-item-stagger on each item for staged reveals.

  Variables. The script below reads each one, falls back to the declared
  default on anything missing or unrecognised, and writes the result as a
  custom property the CSS consumes. The timeline recipe at the bottom is
  untouched by them.

    - accent (mint | blue | violet, default mint): colour of the selection bar
      down the first item, its check mark, and the focus ring. Each option
      rides an existing theme token, so both palettes stay correct.
    - align (right | left, default right): which trigger edge the menu hangs
      from. right keeps the original right edge and top-right scale origin,
      left flips both so the menu opens under the trigger start.
    - density (comfortable | compact, default comfortable): height of the
      trigger and of every item. comfortable is the 40px control height,
      compact tightens to 32px. Coarse pointers keep the 44px hit target.

  On every default the result is identical to the original.
-->

<div
  data-hf-ui-root
  class="hf-ui-dropdown"
  data-composition-variables='[
    { "id": "accent", "type": "enum", "role": "style", "label": "Accent", "description": "Colour of the selection bar, check mark, and focus ring.", "default": "mint", "options": [{ "value": "mint", "label": "Mint" }, { "value": "blue", "label": "Blue" }, { "value": "violet", "label": "Violet" }] },
    { "id": "align", "type": "enum", "role": "style", "label": "Align", "description": "Which trigger edge the menu hangs from and scales out of.", "default": "right", "options": [{ "value": "right", "label": "Right" }, { "value": "left", "label": "Left" }] },
    { "id": "density", "type": "enum", "role": "style", "label": "Density", "description": "Height of the trigger and of every menu item.", "default": "comfortable", "options": [{ "value": "comfortable", "label": "Comfortable" }, { "value": "compact", "label": "Compact" }] }
  ]'
>
  <button
    class="hf-ui-dropdown-trigger"
    type="button"
    aria-expanded="true"
    aria-controls="hf-ui-dropdown-menu"
  >
    Actions
  </button>
  <div class="hf-ui-dropdown-menu" id="hf-ui-dropdown-menu" role="menu">
    <button
      class="hf-ui-dropdown-item"
      style="--hf-dropdown-item-stagger: 0"
      type="button"
      role="menuitem"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 12 4 4 8-9" /></svg>
      <span>Duplicate</span>
    </button>
    <button
      class="hf-ui-dropdown-item"
      style="--hf-dropdown-item-stagger: 1"
      type="button"
      role="menuitem"
    >
      <span>Export</span>
    </button>
    <button
      class="hf-ui-dropdown-item"
      style="--hf-dropdown-item-stagger: 2"
      type="button"
      role="menuitem"
    >
      <span>Archive</span>
    </button>
  </div>
</div>

<script>

    // mint is the token default, so it stays unset and any host theme wins.
    var accents = {
      mint: null,
      blue: "var(--_hf-ui-data-2)",
      violet: "var(--_hf-ui-data-4)",

    var accent = accents[pick(accents, vars.accent, "mint")];
    var align = aligns[pick(aligns, vars.align, "right")];
    var height = densities[pick(densities, vars.density, "comfortable")];

    var roots = document.querySelectorAll(".hf-ui-dropdown");
    for (var i = 0; i < roots.length; i += 1) {
