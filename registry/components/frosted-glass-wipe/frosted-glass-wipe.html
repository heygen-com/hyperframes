<!--
  Frosted Glass Wipe - remocn component ported to HyperFrames authoring format.

  Paste the markup and CSS into a composition. Drive the timeline integration
  from a paused GSAP timeline so renders remain deterministic.

  Variables. The script reads each one, falls back to the declared default on
  anything missing or unrecognised, and writes the result as a custom property
  the CSS consumes. The timeline recipe below is untouched by them: it keeps
  driving one clip edge, two offsets and one glare, and these decide which way
  that clip and those offsets point and how hard the glare reads.

    - direction (right | left, default right): which way the pane travels.
      right wipes the incoming scene in from the left edge and sweeps the
      glare rightwards, left mirrors every horizontal move.
    - accent (blue | violet | green, default blue): colour family of the
      incoming scene behind the glass.
    - glare (soft | standard | intense, default standard): opacity of the
      white band that sweeps across the pane.

  On every default the result is identical to the original: a rightward wipe
  onto a blue to violet scene under a 0.75 alpha glare.
-->

<div
  class="hf-remocn-frosted-glass-wipe"
  data-composition-variables='[
    { "id": "direction", "type": "enum", "role": "style", "label": "Direction", "description": "Which way the glass pane travels: right wipes the incoming scene in from the left edge, left mirrors the whole move.", "default": "right", "options": [{ "value": "right", "label": "Right" }, { "value": "left", "label": "Left" }] },
    { "id": "accent", "type": "enum", "role": "style", "label": "Accent", "description": "Colour family of the incoming scene behind the glass.", "default": "blue", "options": [{ "value": "blue", "label": "Blue" }, { "value": "violet", "label": "Violet" }, { "value": "green", "label": "Green" }] },
    { "id": "glare", "type": "enum", "role": "style", "label": "Glare", "description": "Strength of the white glare that sweeps across the pane, from a faint sheen to a hard specular flash.", "default": "standard", "options": [{ "value": "soft", "label": "Soft" }, { "value": "standard", "label": "Standard" }, { "value": "intense", "label": "Intense" }] }
  ]'
>
  <div class="scene from">Before</div>
  <div class="scene to">Frosted Glass Wipe</div>
  <div class="fx"></div>
  <div class="rgb"></div>
</div>

<style>
  .hf-remocn-frosted-glass-wipe {
    --hf-accent: #2563eb;
    --hf-ink: #111827;
    --hf-muted: #6b7280;
    --hf-surface: #ffffff;
    color: var(--hf-ink);
    font-family: Inter, system-ui, sans-serif;
  }
  .hf-remocn-frosted-glass-wipe {
    position: relative;
    width: 760px;
    height: 428px;
    overflow: hidden;
    border-radius: 30px;
    background: #111827;
    box-shadow: 0 28px 80px rgba(15, 23, 42, 0.2);
  }
  .hf-remocn-frosted-glass-wipe .scene {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    font-weight: 900;
    font-size: 58px;
    letter-spacing: -0.05em;
    color: #fff;
  }
  .hf-remocn-frosted-glass-wipe .from {
    background: linear-gradient(135deg, #111827, #374151);
    transform: translate(calc(var(--hf-from-x, 0px) * var(--hf-axis, 1)), var(--hf-from-y, 0px))
      scale(var(--hf-from-scale, 1));
    filter: blur(var(--hf-from-blur, 0px));
  }
  .hf-remocn-frosted-glass-wipe .to {
    background: linear-gradient(135deg, var(--hf-scene-a, #2563eb), var(--hf-scene-b, #7c3aed));
    transform: translate(calc(var(--hf-to-x, 0px) * var(--hf-axis, 1)), var(--hf-to-y, 0px))
      scale(var(--hf-to-scale, 1));
    clip-path: inset(
      var(--hf-clip-top, 0%) calc(var(--hf-clip-right, 100%) * var(--hf-wipe-right, 1))
        var(--hf-clip-bottom, 0%)
        calc(var(--hf-clip-left, 0%) + var(--hf-clip-right, 100%) * var(--hf-wipe-left, 0))
    );
  }
  .hf-remocn-frosted-glass-wipe .fx {
    position: absolute;
    inset: 0;
    background: linear-gradient(
      90deg,
      transparent,
      rgba(255, 255, 255, var(--hf-fx-alpha, 0.75)),
      transparent
    );
    mix-blend-mode: screen;
    transform: translateX(calc(var(--hf-fx-x, -110%) * var(--hf-axis, 1)));
  }
  .hf-remocn-frosted-glass-wipe .rgb {
    position: absolute;
    inset: 0;
    pointer-events: none;
    opacity: var(--hf-rgb-opacity, 0);
    background: linear-gradient(
      90deg,
      rgba(239, 68, 68, 0.35),
      transparent,
      rgba(34, 211, 238, 0.35)
    );
    transform: translateX(calc(var(--hf-rgb-x, 0px) * var(--hf-axis, 1)));
  }
</style>

<script>
  (function () {
    "use strict";

    var vars =
      window.__hyperframes && window.__hyperframes.getVariables
        ? window.__hyperframes.getVariables()
        : {};

    // Unrecognised overrides return to their declared defaults.
    function pick(table, value, fallback) {
      return Object.prototype.hasOwnProperty.call(table, value) ? value : fallback;
    }

    var accents = {
      blue: { a: "#2563eb", b: "#7c3aed" },
      violet: { a: "#7c3aed", b: "#db2777" },
      green: { a: "#047857", b: "#10b981" },
    };
    var glares = { soft: "0.4", standard: "0.75", intense: "1" };

    var accent = accents[pick(accents, vars.accent, "blue")];
    var glare = glares[pick(glares, vars.glare, "standard")];
    var mirrored = vars.direction === "left";

    var roots = document.querySelectorAll(".hf-remocn-frosted-glass-wipe");
    for (var i = 0; i < roots.length; i += 1) {
      var style = roots[i].style;
      style.setProperty("--hf-axis", mirrored ? "-1" : "1");
      style.setProperty("--hf-wipe-right", mirrored ? "0" : "1");
      style.setProperty("--hf-wipe-left", mirrored ? "1" : "0");
      style.setProperty("--hf-scene-a", accent.a);
      style.setProperty("--hf-scene-b", accent.b);
      style.setProperty("--hf-fx-alpha", glare);
    }
  })();
</script>

<!--
  Timeline integration:
  tl.fromTo('.hf-remocn-frosted-glass-wipe .to', { '--hf-clip-right': '100%', '--hf-to-x': '60px', '--hf-to-scale': 1.04 }, { '--hf-clip-right': '0%', '--hf-to-x': '0px', '--hf-to-scale': 1, duration: 0.9, ease: 'power3.inOut' }, startTime); tl.to('.hf-remocn-frosted-glass-wipe .from', { '--hf-from-x': '-70px', '--hf-from-scale': 0.96, '--hf-from-blur': '5px', duration: 0.9, ease: 'power3.inOut' }, startTime); tl.fromTo('.hf-remocn-frosted-glass-wipe .fx', { '--hf-fx-x': '-110%' }, { '--hf-fx-x': '110%', duration: 0.58, ease: 'power2.inOut' }, startTime + 0.18); tl.fromTo('.hf-remocn-frosted-glass-wipe .rgb', { '--hf-rgb-opacity': 0, '--hf-rgb-x': '-16px' }, { '--hf-rgb-opacity': 1, '--hf-rgb-x': '16px', repeat: 3, yoyo: true, duration: 0.07, ease: 'steps(1)' }, startTime + 0.32);
-->
