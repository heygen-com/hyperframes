<!doctype html>
<!--
  torn-paper-rip demo. This standalone composition mounts the primitive
  FULL-BLEED through data-composition-src, kraft tone and right-to-left
  travel to prove the non-default variable path, and slots two procedural
  scenes so the tear reads as one photo tearing into the next rather than
  the bare token cards the primitive falls back to.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Torn Paper Rip Demo</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #0b0c10;
      }
      #root {
        --bg: #0b0c10;
        --fg: #f2ede2;
        --surface: #fffdf8;
        --accent: #2f6fed;
        --accent-2: #b98a4e;
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #0b0c10;
      }
      .mount-bleed {
        position: absolute;
        inset: 0;
        container-type: size;
        overflow: hidden;
      }
      .demo-scene {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: end start;
      }
      .demo-scene img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .demo-caption {
        position: relative;
        margin: 64px;
        padding: 14px 22px;
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        font-weight: 700;
        font-size: 30px;
        letter-spacing: 0.04em;
        color: #fff;
        background: rgba(10, 10, 12, 0.35);
        border-radius: 8px;
        backdrop-filter: blur(6px);
      }
    </style>
  </head>
  <body>
    <template data-slot="torn-paper-rip-from">
      <div class="demo-scene">
        <img alt="" src="" id="demo-scene-from-img" />
        <div class="demo-caption">Harbor at dusk</div>
      </div>
    </template>
    <template data-slot="torn-paper-rip-to">
      <div class="demo-scene">
        <img alt="" src="" id="demo-scene-to-img" />
        <div class="demo-caption">Terrace, morning</div>
      </div>
    </template>

    <div
      id="root"
      data-composition-id="torn-paper-rip-demo"
      data-start="0"
      data-width="1920"
      data-height="1080"
      data-duration="2.4"
      data-fps="30"
    >
      <div
        id="torn-paper-rip-mount"
        class="mount-bleed clip"
        data-composition-id="torn-paper-rip"
        data-composition-src="./torn-paper-rip.html"
        data-variable-values='{"direction":"right-to-left","tone":"kraft","roughness":72}'
        data-start="0"
        data-duration="2.4"
        data-track-index="0"
        data-width="1920"
        data-height="1080"
      ></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        // Two procedural SVG scenes, so the demo is deterministic and ships
        // nothing licensed (same approach as grade-split-reveal).
        function harborScene() {
          return (
            '<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">' +
            '<defs><linearGradient id="hs-sky" x1="0" y1="0" x2="0" y2="1">' +
            '<stop offset="0" stop-color="#1b2340"/><stop offset="0.55" stop-color="#7a4a5a"/>' +
            '<stop offset="1" stop-color="#f0a75c"/></linearGradient>' +
            '<linearGradient id="hs-sea" x1="0" y1="0" x2="0" y2="1">' +
            '<stop offset="0" stop-color="#c98a55"/><stop offset="1" stop-color="#131226"/></linearGradient></defs>' +
            '<rect width="1600" height="900" fill="url(#hs-sky)"/>' +
            '<circle cx="1080" cy="560" r="70" fill="#ffe6bf"/>' +
            '<path d="M0 620 L260 560 L470 610 L700 540 L900 600 L1140 550 L1600 600 L1600 900 L0 900 Z" fill="#241a2e"/>' +
            '<rect y="640" width="1600" height="260" fill="url(#hs-sea)"/>' +
            '<rect x="1050" y="640" width="60" height="260" fill="#ffdfa8" opacity="0.4"/>' +
            "</svg>"
          );
        }
        function terraceScene() {
          return (
            '<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">' +
            '<defs><linearGradient id="ts-sky" x1="0" y1="0" x2="0" y2="1">' +
            '<stop offset="0" stop-color="#bfe3f2"/><stop offset="1" stop-color="#f4ead0"/></linearGradient></defs>' +
            '<rect width="1600" height="900" fill="url(#ts-sky)"/>' +
            '<circle cx="420" cy="220" r="90" fill="#fff7dd"/>' +
            '<rect y="560" width="1600" height="340" fill="#e7d9b8"/>' +
            '<g fill="#c9b183"><rect x="60" y="600" width="220" height="260" rx="6"/>' +
            '<rect x="340" y="640" width="220" height="220" rx="6"/>' +
            '<rect x="1280" y="600" width="260" height="260" rx="6"/></g>' +
            '<g stroke="#9c8a5f" stroke-width="6"><line x1="0" y1="560" x2="1600" y2="560"/></g>' +
            "</svg>"
          );
        }
        // Elements inside an inert <template> are not in the live document,
        // so they must be reached through the template's own content
        // fragment, never document.getElementById.
        function setSlotImage(slotName, imgId, svg) {
          document
            .querySelector('template[data-slot="' + slotName + '"]')
            .content.getElementById(imgId).src =
            "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
        }
        setSlotImage("torn-paper-rip-from", "demo-scene-from-img", harborScene());
        setSlotImage("torn-paper-rip-to", "demo-scene-to-img", terraceScene());

        window.__timelines = window.__timelines || {};
        window.__timelines["torn-paper-rip-demo"] = gsap.timeline({ paused: true });
      })();
    </script>
  </body>
</html>
