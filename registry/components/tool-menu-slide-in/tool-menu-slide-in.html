<!--
  Tool Menu Slide In - remocn component ported to HyperFrames authoring format.

  Paste the markup, CSS and script into a composition. Drive the timeline
  integration from a paused GSAP timeline so renders remain deterministic.

  Variables. The script reads each one, falls back to the declared default on
  anything missing or unrecognised, and writes the result into the markup or
  into a custom property the CSS above consumes. The timeline recipe below is
  untouched by them: it keeps driving the same wipe, the same offsets and the
  same chromatic flicker.

    - from-text (string, default "Before"): the outgoing panel label, on screen
      before the wipe. Blank falls back to the default.
    - to-text (string, default "Tool Menu Slide In"): the incoming panel label.
      The incoming panel is fully clipped while it rests, so it only shows once
      the timeline wipes it open. Blank falls back to the default.
    - distance (close | standard | far, default standard): scales the sideways
      offset the timeline drives on both panels, so they cover a shorter or
      longer run in the same time. Both panels rest at their settled position on
      every setting, so this only changes the middle of the wipe.
    - accent (blue | violet | emerald, default blue): colour family of the
      incoming panel gradient. Like the panel it paints, it stays behind the
      clip until the timeline wipes it open.

  On every default the result is identical to the original: a grey panel slides
  left while a blue to violet panel wipes in from the right.
-->

<div
  class="hf-remocn-tool-menu-slide-in"
  data-composition-variables='[
    {"id": "from-text", "type": "string", "role": "content", "label": "From text", "description": "The outgoing panel label, on screen before the wipe.", "default": "Before"},
    {"id": "to-text", "type": "string", "role": "content", "label": "To text", "description": "The incoming panel label. It stays clipped until the timeline wipes it open.", "default": "Tool Menu Slide In"},
    {"id": "distance", "type": "enum", "role": "motion", "label": "Distance", "description": "Scales the sideways offset the timeline drives on both panels, so they cover a shorter or longer run in the same time.", "default": "standard", "options": [{"value": "close", "label": "Close"}, {"value": "standard", "label": "Standard"}, {"value": "far", "label": "Far"}]},
    {"id": "accent", "type": "enum", "role": "style", "label": "Accent", "description": "Colour family of the incoming panel gradient, revealed as the timeline wipes that panel open.", "default": "blue", "options": [{"value": "blue", "label": "Blue"}, {"value": "violet", "label": "Violet"}, {"value": "emerald", "label": "Emerald"}]}
  ]'
>
  <div class="scene from">Before</div>
  <div class="scene to">Tool Menu Slide In</div>
  <div class="fx"></div>
  <div class="rgb"></div>
</div>

<style>
  .hf-remocn-tool-menu-slide-in {
    --hf-accent: #2563eb;
    --hf-ink: #111827;
    --hf-muted: #6b7280;
    --hf-surface: #ffffff;
    color: var(--hf-ink);
    font-family: Inter, system-ui, sans-serif;
  }
  .hf-remocn-tool-menu-slide-in {
    position: relative;
    width: 760px;
    height: 428px;
    overflow: hidden;
    border-radius: 30px;
    background: #111827;
    box-shadow: 0 28px 80px rgba(15, 23, 42, 0.2);
  }
  .hf-remocn-tool-menu-slide-in .scene {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    font-weight: 900;
    font-size: 58px;
    letter-spacing: -0.05em;
    color: #fff;
  }
  .hf-remocn-tool-menu-slide-in .from {
    background: linear-gradient(135deg, #111827, #374151);
    transform: translate(
        calc(var(--hf-from-x, 0px) * var(--hf-slide-reach, 1)),
        var(--hf-from-y, 0px)
      )
      scale(var(--hf-from-scale, 1));
    filter: blur(var(--hf-from-blur, 0px));
  }
  .hf-remocn-tool-menu-slide-in .to {
    background: linear-gradient(
      135deg,
      var(--hf-slide-accent, var(--hf-accent, #2563eb)),
      var(--hf-slide-accent-far, #7c3aed)
    );
    transform: translate(calc(var(--hf-to-x, 0px) * var(--hf-slide-reach, 1)), var(--hf-to-y, 0px))
      scale(var(--hf-to-scale, 1));
    clip-path: inset(
      var(--hf-clip-top, 0%) var(--hf-clip-right, 100%) var(--hf-clip-bottom, 0%)
        var(--hf-clip-left, 0%)
    );
  }
  .hf-remocn-tool-menu-slide-in .fx {
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.75), transparent);
    mix-blend-mode: screen;
    transform: translateX(var(--hf-fx-x, -110%));
  }
  .hf-remocn-tool-menu-slide-in .rgb {
    position: absolute;
    inset: 0;
    pointer-events: none;
    opacity: var(--hf-rgb-opacity, 0);
    background: linear-gradient(
      90deg,
      rgba(239, 68, 68, 0.35),
      transparent,
      rgba(34, 211, 238, 0.35)
    );
    transform: translateX(var(--hf-rgb-x, 0px));
  }
</style>

<script>
  (function () {
    "use strict";

    var vars =
      window.__hyperframes && window.__hyperframes.getVariables
        ? window.__hyperframes.getVariables()
        : {};

    // Unrecognised overrides return to their declared defaults.
    var reaches = { close: 0.5, standard: 1, far: 1.85 };
    var accents = {
      blue: { near: "var(--hf-accent, #2563eb)", far: "#7c3aed" },
      violet: { near: "#7c3aed", far: "#db2777" },
      emerald: { near: "#059669", far: "#0891b2" },
    };

    function pick(table, value, fallback) {
      return Object.prototype.hasOwnProperty.call(table, value) ? value : fallback;
    }

    function text(value, fallback) {
      var resolved = value == null ? "" : String(value).trim();
      return resolved.length > 0 ? resolved : fallback;
    }

    var fromText = text(vars["from-text"], "Before");
    var toText = text(vars["to-text"], "Tool Menu Slide In");
    var reach = reaches[pick(reaches, vars.distance, "standard")];
    var accent = accents[pick(accents, vars.accent, "blue")];

    var roots = document.querySelectorAll(".hf-remocn-tool-menu-slide-in");
    for (var i = 0; i < roots.length; i += 1) {
      var root = roots[i];
      root.style.setProperty("--hf-slide-reach", String(reach));
      root.style.setProperty("--hf-slide-accent", accent.near);
      root.style.setProperty("--hf-slide-accent-far", accent.far);
      root.querySelector(".from").textContent = fromText;
      root.querySelector(".to").textContent = toText;
    }
  })();
</script>

<!--
  Timeline integration:
  tl.fromTo('.hf-remocn-tool-menu-slide-in .to', { '--hf-clip-right': '100%', '--hf-to-x': '60px', '--hf-to-scale': 1.04 }, { '--hf-clip-right': '0%', '--hf-to-x': '0px', '--hf-to-scale': 1, duration: 0.9, ease: 'power3.inOut' }, startTime); tl.to('.hf-remocn-tool-menu-slide-in .from', { '--hf-from-x': '-70px', '--hf-from-scale': 0.96, '--hf-from-blur': '5px', duration: 0.9, ease: 'power3.inOut' }, startTime); tl.fromTo('.hf-remocn-tool-menu-slide-in .fx', { '--hf-fx-x': '-110%' }, { '--hf-fx-x': '110%', duration: 0.58, ease: 'power2.inOut' }, startTime + 0.18); tl.fromTo('.hf-remocn-tool-menu-slide-in .rgb', { '--hf-rgb-opacity': 0, '--hf-rgb-x': '-16px' }, { '--hf-rgb-opacity': 1, '--hf-rgb-x': '16px', repeat: 3, yoyo: true, duration: 0.07, ease: 'steps(1)' }, startTime + 0.32);
-->
