<!--
  Scroll Area - Operator Black bounded-content primitive for HyperFrames.

  Paste the markup, CSS and script into a composition. Animate the CSS
  variables from a paused GSAP timeline for deterministic video renders.

  Variables. The script reads each one, falls back to the declared default on
  anything missing or unrecognised, and writes the result as a custom property
  the CSS below consumes. The timeline recipe stays untouched by them: it keeps
  driving one content offset and one thumb offset, and these decide how large
  the viewport is, how tall the rows are, how the bar looks, and how far that
  pair of offsets carries.

    - height (compact | standard | tall, default standard): height of the
      viewport, which decides how much of the list is visible at once. 140px,
      190px, or 260px.
    - density (compact | standard | roomy, default standard): row height,
      padding, type size and the gap between rows, from 28px rows of 12px type
      through 36px rows of 13px type to 46px rows of 14px type.
    - scrollbar (subtle | prominent | hidden, default subtle): the thumb. subtle
      is the thin muted 4px bar, prominent a 7px brighter one, hidden removes it
      entirely.
    - travel (near | standard | far, default standard): scales the scroll
      offsets the timeline drives, so the list covers roughly half, all, or half
      again as much ground in the same time. Content and thumb scale together,
      so they stay in sync.

  On every default the result is identical to the original: a 190px viewport,
  36px rows of 13px type, a thin 4px thumb, and the full 64px scroll.
-->

  data-hf-ui-root
  class="hf-ui-scroll-area"
  role="region"
  tabindex="0"
  aria-label="Scene list"
  data-composition-variables='[
    { "id": "height", "type": "enum", "role": "layout", "label": "Height", "description": "Height of the viewport, which decides how much of the list is visible at once.", "default": "standard", "options": [{ "value": "compact", "label": "Compact" }, { "value": "standard", "label": "Standard" }, { "value": "tall", "label": "Tall" }] },

    { "id": "scrollbar", "type": "enum", "role": "style", "label": "Scrollbar", "description": "Thumb treatment: a thin muted bar, a wider brighter one, or no bar at all.", "default": "subtle", "options": [{ "value": "subtle", "label": "Subtle" }, { "value": "prominent", "label": "Prominent" }, { "value": "hidden", "label": "Hidden" }] },
    { "id": "travel", "type": "enum", "role": "motion", "label": "Travel", "description": "Scales the scroll offsets the timeline drives, so the list covers more or less ground in the same time.", "default": "standard", "options": [{ "value": "near", "label": "Near" }, { "value": "standard", "label": "Standard" }, { "value": "far", "label": "Far" }] }
