<!doctype html>
<!--
  Zoom Follow Cursor (camera primitive), mountable sub-composition

  concept: screen-recording auto-zoom. A cursor works through three clicks on a screen while
  the camera pushes in toward each upcoming click, trails the cursor on a smooth spring, marks
  every click with a soft ripple, then eases back out to the full screen as the cursor leaves.

  mount contract: loaded by a host through data-composition-src; only <template> is cloned.
  #root fills the host clip (inset:0). See demo.html.

  variables:
    image (image)                  your own screenshot; empty shows the built-in dashboard
    zoom (1.2 to 2.6)              camera scale while it follows the cursor
    click1_x .. click3_y (% of the screen)  the three click points, in order
    accent (color)                 ripple colour

  envelope (default 6s): zoom in 0.25-1.1s, clicks at 1.3s, 2.7s and 4.1s, zoom out
  4.5-5.5s while the cursor exits. Shorter durations compress every beat evenly.
-->
<html
  lang="en"
  data-composition-id="cursor-zoom-follow"
  data-composition-duration="6"
  data-composition-variables='[
    { "id": "image", "type": "image", "role": "content", "label": "Screenshot", "description": "Your own screen capture. Leave empty for the built-in dashboard.", "default": "" },
    { "id": "zoom", "type": "number", "role": "style", "label": "Zoom", "default": 1.8, "min": 1.2, "max": 2.6, "step": 0.1 },
    { "id": "click1_x", "type": "number", "role": "layout", "label": "Click 1 X", "default": 68.5, "min": 0, "max": 100, "step": 0.5, "unit": "%" },
    { "id": "click1_y", "type": "number", "role": "layout", "label": "Click 1 Y", "default": 7.5, "min": 0, "max": 100, "step": 0.5, "unit": "%" },
    { "id": "click2_x", "type": "number", "role": "layout", "label": "Click 2 X", "default": 50, "min": 0, "max": 100, "step": 0.5, "unit": "%" },
    { "id": "click2_y", "type": "number", "role": "layout", "label": "Click 2 Y", "default": 48.5, "min": 0, "max": 100, "step": 0.5, "unit": "%" },
    { "id": "click3_x", "type": "number", "role": "layout", "label": "Click 3 X", "default": 90.5, "min": 0, "max": 100, "step": 0.5, "unit": "%" },
    { "id": "click3_y", "type": "number", "role": "layout", "label": "Click 3 Y", "default": 7.5, "min": 0, "max": 100, "step": 0.5, "unit": "%" },
    { "id": "accent", "type": "color", "role": "style", "label": "Ripple", "default": "#4f5bff" }
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Zoom Follow Cursor</title>
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          isolation: isolate;
          container-type: size;
          background: #f4f5f9;
          font-family: var(--font-body, Inter, system-ui, sans-serif);
          color: #171a26;
        }
        .zf-cam,
        .zf-app,
        .zf-img {
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
        }
        .zf-cam {
          transform-origin: 0 0;
          will-change: transform;
        }
        .zf-img {
          object-fit: cover;
          display: none;
        }
        .zf-app div {
          position: absolute;
        }
        .zf-card {
          border-radius: 1cqw;
          background: #ffffff;
          box-shadow: 0 0 0 1px rgba(20, 24, 40, 0.07);
        }
        .zf-side {
          left: 0;
          top: 0;
          width: 15%;
          height: 100%;
          background: #ffffff;
          box-shadow: 1px 0 0 rgba(20, 24, 40, 0.07);
          padding: 2.2cqw 1.6cqw;
          font-size: 1.05cqw;
        }
        .zf-side p {
          margin: 0 0 1.5cqw;
          color: #5d6275;
        }
        .zf-side p.on {
          color: #171a26;
          font-weight: 650;
        }
        .zf-h {
          font-size: 2.1cqw;
          font-weight: 700;
          letter-spacing: -0.02em;
        }
        .zf-sub {
          font-size: 0.95cqw;
          color: #7a7f93;
        }
        .zf-pill {
          height: 5.4%;
          border-radius: 0.7cqw;
          font-size: 1.05cqw;
          font-weight: 600;
          display: flex;
          align-items: center;
          justify-content: center;
        }
        .zf-kpi b {
          display: block;
          font-size: 2cqw;
          margin-top: 0.5cqw;
        }
        .zf-kpi span {
          font-size: 0.95cqw;
          color: #7a7f93;
        }
        .zf-row {
          left: 2%;
          right: 2%;
          height: 20%;
          display: flex;
          align-items: center;
          justify-content: space-between;
          font-size: 1cqw;
          border-top: 1px solid #eef0f5;
        }
        .zf-bar {
          left: 6%;
          right: 6%;
          color: #5d6275;
        }
        .zf-bar i {
          display: block;
          height: 0.7cqw;
          margin-top: 0.5cqw;
          border-radius: 0.35cqw;
          background: #c9cdfb;
        }
        .zf-ripple {
          position: absolute;
          left: 0;
          top: 0;
          width: 4cqw;
          height: 4cqw;
          margin: -2cqw 0 0 -2cqw;
          border-radius: 50%;
          opacity: 0;
        }
        .zf-cursor {
          position: absolute;
          left: 0;
          top: 0;
          width: 2.6cqw;
          height: 2.6cqw;
          filter: drop-shadow(0 0.2cqw 0.3cqw rgba(0, 0, 0, 0.3));
        }
        .zf-cursor path {
          fill: #ffffff;
          stroke: #111217;
          stroke-width: 1.4;
          stroke-linejoin: round;
        }
      </style>

      <div id="root" data-composition-id="cursor-zoom-follow" data-duration="6">
        <div class="zf-cam" id="zf-cam">
          <img class="zf-img" id="zf-img" alt="" />
          <div class="zf-app" id="zf-app">
            <div class="zf-side">
              <p class="on">Overview</p>
              <p>Revenue</p>
              <p>Customers</p>
              <p>Invoices</p>
              <p>Settings</p>
            </div>
            <div class="zf-h" style="left: 18%; top: 4%">Revenue</div>
            <div class="zf-sub" style="left: 18%; top: 9.2%">Updated 2 minutes ago</div>
            <div class="zf-pill zf-card" id="zf-range" style="left: 62%; top: 4.8%; width: 13%">
              Last 30 days
            </div>
            <div
              class="zf-pill"
              id="zf-export"
              style="left: 85%; top: 4.8%; width: 11%; background: #171a26; color: #fff"
            >
              Export
            </div>
            <div
              class="zf-card zf-kpi"
              style="left: 18%; top: 16%; width: 24.5%; height: 13%; padding: 1.4cqw"
            >
              <span>Net revenue</span><b>$84,210</b>
            </div>
            <div
              class="zf-card zf-kpi"
              style="left: 44.75%; top: 16%; width: 24.5%; height: 13%; padding: 1.4cqw"
            >
              <span>Active customers</span><b>1,284</b>
            </div>
            <div
              class="zf-card zf-kpi"
              style="left: 71.5%; top: 16%; width: 24.5%; height: 13%; padding: 1.4cqw"
            >
              <span>Churn</span><b>2.1%</b>
            </div>
            <div class="zf-card" style="left: 18%; top: 32%; width: 51.25%; height: 35%">
              <svg
                viewBox="0 0 100 50"
                preserveAspectRatio="none"
                style="position: absolute; inset: 12% 4% 8%; width: 92%; height: 80%"
              >
                <path
                  d="M0 40 L10 36 L20 38 L30 30 L40 31 L50 22 L60 25 L70 17 L80 19 L90 10 L100 12"
                  fill="none"
                  stroke="#4f5bff"
                  stroke-width="1.2"
                  vector-effect="non-scaling-stroke"
                />
              </svg>
              <div
                class="zf-card"
                id="zf-tip"
                style="
                  left: 60%;
                  top: 8%;
                  padding: 0.6cqw 0.9cqw;
                  font-size: 0.95cqw;
                  opacity: 0;
                  box-shadow: 0 0.6cqw 1.6cqw rgba(20, 24, 40, 0.16);
                "
              >
                Sep 14 <b>$3,920</b>
              </div>
            </div>
            <div
              class="zf-card"
              style="
                left: 71.5%;
                top: 32%;
                width: 24.5%;
                height: 35%;
                padding: 1.4cqw;
                font-size: 1cqw;
              "
            >
              <b>Top plans</b>
              <div class="zf-bar" style="top: 26%">Team<i style="width: 46%"></i></div>
              <div class="zf-bar" style="top: 50%">Business<i style="width: 32%"></i></div>
              <div class="zf-bar" style="top: 74%">Starter<i style="width: 22%"></i></div>
            </div>
            <div class="zf-card" style="left: 18%; top: 70%; width: 78%; height: 26%">
              <div class="zf-row" style="top: 0; border: 0; color: #7a7f93">
                Customer<span>Plan</span><span>Amount</span>
              </div>
              <div class="zf-row" style="top: 20%">
                Harbor Freight Co.<span>Team</span><span>$1,240</span>
              </div>
              <div class="zf-row" style="top: 40%">
                Lumen Dental<span>Starter</span><span>$320</span>
              </div>
              <div class="zf-row" style="top: 60%">
                Parkside Studio<span>Business</span><span>$2,880</span>
              </div>
            </div>
          </div>
          <div class="zf-ripple" id="zf-ripple"></div>
          <svg class="zf-cursor" id="zf-cursor" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M5 3 L5 19 L9 15 L12 22 L15 20.5 L11.5 14 L18 14 Z" />
          </svg>
        </div>
      </div>

      <script>
        (function () {
          "use strict";

          var html = document.documentElement;
          var root = document.getElementById("root");
          var cam = document.getElementById("zf-cam");
          var cursor = document.getElementById("zf-cursor");
          var ripple = document.getElementById("zf-ripple");
          var range = document.getElementById("zf-range");
          var tip = document.getElementById("zf-tip");
          var exportBtn = document.getElementById("zf-export");

          var DEFAULTS = {};
          try {
            JSON.parse(html.getAttribute("data-composition-variables") || "[]").forEach(
              function (variable) {
                DEFAULTS[variable.id] = variable.default;
              },
            );
          } catch (error) {
            /* malformed declaration falls back to the inline defaults below */
          }
          var scopedVariables = {};
          try {
            if (window.__hyperframes && typeof window.__hyperframes.getVariables === "function") {
              scopedVariables = window.__hyperframes.getVariables() || {};
            }
          } catch (error) {
            /* no scoped variables API in this context */
          }
          var vars = Object.assign({}, DEFAULTS, window.__hfVariables || {}, scopedVariables);

          function num(value, fallback, lo, hi) {
            var n = Number(value);
            if (!isFinite(n)) n = fallback;
            return Math.max(lo, Math.min(hi, n));
          }

          // Rebuilt from parsed digits, never the original string: a regex match
          // alone still carries the source text through, digit-by-digit reassembly
          // does not.
          function color(value, fallback) {
            var m = /^#([0-9a-fA-F]{3}|[0-9a-fA-F]{6})$/.exec(String(value == null ? "" : value));
            if (!m) return fallback;
            var hex = m[1].length === 3 ? m[1].replace(/(.)/g, "$1$1") : m[1];
            var r = parseInt(hex.slice(0, 2), 16);
            var g = parseInt(hex.slice(2, 4), 16);
            var b = parseInt(hex.slice(4, 6), 16);
            return "rgb(" + r + "," + g + "," + b + ")";
          }

          // Hardcoded: the compositor rewrites the wrapper's attributes on mount.
          var compositionId = "cursor-zoom-follow";
          var duration = Math.max(
            0.001,
            parseFloat(
              root.dataset.duration || html.getAttribute("data-composition-duration") || "6",
            ),
          );
          var W = root.clientWidth || 1920;
          var H = root.clientHeight || 1080;
          var ZOOM = num(vars.zoom, 1.8, 1, 3);
          var accent = color(vars.accent, "rgb(79,91,255)");
          // Mirrors @hyperframes/parsers' isSafeMediaUrl allowlist: this
          // composition has no build step to import it from, so the same
          // scheme rule (relative or http/https/blob/data:image only) is
          // inlined rather than trusting the raw variable into img.src.
          function safeImageUrl(value) {
            var s = typeof value === "string" ? value.trim() : "";
            if (s === "") return "";
            var stripped = s.replace(/[\u0000-\u0020]/g, "");
            var scheme = /^([a-z][a-z0-9+.-]*):/i.exec(stripped);
            if (!scheme) return s;
            var proto = scheme[1].toLowerCase();
            if (proto === "https" || proto === "http" || proto === "blob") return s;
            if (proto === "data") return /^data:image\//i.test(s) ? s : "";
            return "";
          }
          var image = safeImageUrl(vars.image);
          var builtIn = image === "";
          if (!builtIn) {
            var img = document.getElementById("zf-img");
            img.src = image;
            img.style.display = "block";
            document.getElementById("zf-app").style.display = "none";
          }
          ripple.style.border = "0.25cqw solid " + accent;
          ripple.style.background = "color-mix(in srgb, " + accent + " 18%, transparent)";

          function pt(x, y) {
            return { x: (x / 100) * W, y: (y / 100) * H };
          }
          var CLICKS = [
            pt(num(vars.click1_x, 68.5, 0, 100), num(vars.click1_y, 7.5, 0, 100)),
            pt(num(vars.click2_x, 50, 0, 100), num(vars.click2_y, 48.5, 0, 100)),
            pt(num(vars.click3_x, 90.5, 0, 100), num(vars.click3_y, 7.5, 0, 100)),
          ];
          var START = pt(80, 88);
          var END = pt(104, 72);

          var k = duration / 6;
          var MOVES = [
            { from: START, to: CLICKS[0], at: 0.3 * k, end: 1.2 * k, click: 1.3 * k },
            { from: CLICKS[0], to: CLICKS[1], at: 1.7 * k, end: 2.6 * k, click: 2.7 * k },
            { from: CLICKS[1], to: CLICKS[2], at: 3.1 * k, end: 3.9 * k, click: 4.1 * k },
          ];
          var EXIT_AT = 4.6 * k;
          var EXIT_END = 5.6 * k;

          function clamp01(u) {
            return u < 0 ? 0 : u > 1 ? 1 : u;
          }
          function mix(a, b, u) {
            return a + (b - a) * u;
          }
          var easeInOut = gsap.parseEase("power2.inOut");
          var easeIn = gsap.parseEase("power2.in");
          var camEase = gsap.parseEase("power3.inOut");

          function arc(p0, p1, u, bend) {
            var cx = (p0.x + p1.x) / 2 - (p1.y - p0.y) * bend;
            var cy = (p0.y + p1.y) / 2 + (p1.x - p0.x) * bend;
            var w = 1 - u;
            return {
              x: w * w * p0.x + 2 * w * u * cx + u * u * p1.x,
              y: w * w * p0.y + 2 * w * u * cy + u * u * p1.y,
            };
          }

          function cursorAt(t) {
            var here = START;
            for (var i = 0; i < MOVES.length; i++) {
              var m = MOVES[i];
              if (t < m.at) return here;
              if (t <= m.end)
                return arc(m.from, m.to, easeInOut(clamp01((t - m.at) / (m.end - m.at))), 0.12);
              here = m.to;
            }
            if (t < EXIT_AT) return here;
            return arc(here, END, easeIn(clamp01((t - EXIT_AT) / (EXIT_END - EXIT_AT))), -0.1);
          }

          function zoomAt(t) {
            if (t < 4.5 * k) return mix(1, ZOOM, camEase(clamp01((t - 0.25 * k) / (0.85 * k))));
            return mix(ZOOM, 1, camEase(clamp01((t - 4.5 * k) / (1.0 * k))));
          }

          // The camera aims between the cursor and the click it is heading for, so the push leads.
          function aimAt(t) {
            var c = cursorAt(t);
            var next = null;
            for (var i = 0; i < MOVES.length; i++) {
              if (t <= MOVES[i].click) {
                next = MOVES[i].to;
                break;
              }
            }
            if (!next) return c;
            return { x: mix(c.x, next.x, 0.6), y: mix(c.y, next.y, 0.6) };
          }

          // A critically damped spring over the aim, integrated once at load and read back by time.
          var FPS = 60;
          var OMEGA = 6;
          var samples = [];
          var s = aimAt(0);
          var v = { x: 0, y: 0 };
          var SUB = 4;
          var dt = 1 / (FPS * SUB);
          var frames = Math.ceil(duration * FPS) + 1;
          for (var f = 0; f <= frames; f++) {
            samples.push({ x: s.x, y: s.y });
            for (var j = 0; j < SUB; j++) {
              var aim = aimAt((f * SUB + j) * dt);
              v.x += (OMEGA * OMEGA * (aim.x - s.x) - 2 * OMEGA * v.x) * dt;
              v.y += (OMEGA * OMEGA * (aim.y - s.y) - 2 * OMEGA * v.y) * dt;
              s.x += v.x * dt;
              s.y += v.y * dt;
            }
          }
          function cameraAt(t) {
            var p = Math.max(0, Math.min(frames, t * FPS));
            var i = Math.floor(p);
            var a = samples[i];
            var b = samples[Math.min(frames, i + 1)];
            return { x: mix(a.x, b.x, p - i), y: mix(a.y, b.y, p - i) };
          }

          function lastClickBefore(t) {
            var hit = null;
            MOVES.forEach(function (m, i) {
              if (t >= m.click) hit = { at: m.click, p: m.to, index: i };
            });
            return hit;
          }

          function render(t) {
            var z = zoomAt(t);
            var c = cameraAt(t);
            // Keep the zoomed window inside the screen so its edge never shows.
            var hw = W / (2 * z);
            var hh = H / (2 * z);
            var cx = Math.max(hw, Math.min(W - hw, c.x));
            var cy = Math.max(hh, Math.min(H - hh, c.y));
            cam.style.transform =
              "translate(" +
              (W / 2 - cx * z).toFixed(2) +
              "px," +
              (H / 2 - cy * z).toFixed(2) +
              "px) scale(" +
              z.toFixed(4) +
              ")";

            var p = cursorAt(t);
            var hit = lastClickBefore(t);
            var since = hit ? t - hit.at : 99;
            var dip = since < 0.08 ? since / 0.08 : since < 0.28 ? 1 - (since - 0.08) / 0.2 : 0;
            cursor.style.transformOrigin = "21% 12.5%";
            cursor.style.transform =
              "translate(" +
              p.x.toFixed(2) +
              "px," +
              p.y.toFixed(2) +
              "px) translate(-21%,-12.5%) scale(" +
              (1 - 0.15 * dip).toFixed(3) +
              ")";
            cursor.style.opacity = t >= duration ? "0" : "1";

            var u = clamp01(since / 0.55);
            ripple.style.opacity = hit && since < 0.55 ? (0.6 * (1 - u)).toFixed(3) : "0";
            if (hit) {
              ripple.style.transform =
                "translate(" +
                hit.p.x.toFixed(2) +
                "px," +
                hit.p.y.toFixed(2) +
                "px) scale(" +
                (0.3 + 0.9 * gsap.parseEase("power2.out")(u)).toFixed(3) +
                ")";
            }

            if (builtIn) {
              var index = hit ? hit.index : -1;
              range.style.boxShadow = index >= 0 ? "0 0 0 2px " + accent : "";
              var tipOn = index >= 1 ? clamp01((t - MOVES[1].click) / 0.25) : 0;
              tip.style.opacity = tipOn.toFixed(3);
              tip.style.transform = "translateY(" + ((1 - tipOn) * 8).toFixed(2) + "px)";
              var press = index === 2 && since < 0.28 ? dip : 0;
              exportBtn.style.transform = "scale(" + (1 - 0.05 * press).toFixed(3) + ")";
            }
          }

          var clock = { t: 0 };
          var tl = gsap.timeline({ paused: true });
          tl.to(
            clock,
            {
              t: duration,
              duration: duration,
              ease: "none",
              onUpdate: function () {
                render(clock.t);
              },
            },
            0,
          );
          render(0);
          tl.seek(0);
          window.__timelines = window.__timelines || {};
          window.__timelines[compositionId] = tl;
        })();
      </script>
    </template>
  </body>
</html>
