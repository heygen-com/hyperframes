<!doctype html>
<!--
  Zoom Follow Cursor, standalone demo: a screen recording framed on a flat dark ground. The mounted
  screen is the built-in dashboard; clicks land at 0.95s, 2.55s and 3.65s.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Zoom Follow Cursor, Demo</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #111318;
      }
      .window {
        position: absolute;
        left: 160px;
        top: 90px;
        width: 1600px;
        height: 900px;
        border-radius: 22px;
        overflow: hidden;
        box-shadow:
          0 0 0 1px #2a2d35,
          0 24px 64px rgba(0, 0, 0, 0.5);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="cursor-zoom-follow-demo"
      data-start="0"
      data-width="1920"
      data-height="1080"
      data-duration="5.8"
    >
      <div
        class="window clip"
        id="cursor-zoom-follow"
        data-composition-id="cursor-zoom-follow"
        data-composition-src="./cursor-zoom-follow.html"
        data-variable-values='{"zoom":1.8,"accent":"#0a84ff"}'
        data-start="0"
        data-duration="5.8"
        data-track-index="0"
        data-width="1600"
        data-height="900"
      ></div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });
      window.__timelines["cursor-zoom-follow-demo"] = tl;
    </script>
  </body>
</html>
