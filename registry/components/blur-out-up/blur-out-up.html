<!--
  Blur Out Up - typography primitive for HyperFrames.

  Paste the markup, CSS and script into a composition. Drive the timeline
  integration from a paused GSAP timeline so renders remain deterministic.

  Variables. The script reads each one, falls back to the declared default on
  anything missing or unrecognised, and writes the result as a custom property
  the CSS above consumes. The timeline recipe below is untouched by them: it
  keeps driving one offset and one blur, and these decide what that offset and
  that blur mean on screen.

    - direction (up | down | left | right, default up): where the offset
      points. up rises into place, down drops in, left and right slide in
      along the baseline.
    - distance (close | standard | far, default standard): scales the offset.
      close covers half the run, far nearly double, in the same time.
    - blur (soft | standard | heavy, default standard): scales the blur radius,
      from a light haze to a full smear.
    - tone (ink | paper | accent, default ink): word colour. ink is near-black
      for light frames, paper near-white for dark ones, accent rides --brand.

  On every default the result is identical to the original: words rise 22px
  through a 5px blur in near-black.
-->

<div
  class="hf-catalog-blur-out-up"
  data-composition-variables='[
    { "id": "direction", "type": "enum", "role": "motion", "label": "Direction", "description": "Where the offset the timeline drives points.", "default": "up", "options": [{ "value": "up", "label": "Up" }, { "value": "down", "label": "Down" }, { "value": "left", "label": "Left" }, { "value": "right", "label": "Right" }] },
    { "id": "distance", "type": "enum", "role": "motion", "label": "Distance", "description": "Scales the travel offset, so the words cover a shorter or longer run in the same time.", "default": "standard", "options": [{ "value": "close", "label": "Close" }, { "value": "standard", "label": "Standard" }, { "value": "far", "label": "Far" }] },
    { "id": "blur", "type": "enum", "role": "style", "label": "Blur", "description": "Scales the blur radius the timeline drives, from a light haze to a full smear.", "default": "standard", "options": [{ "value": "soft", "label": "Soft" }, { "value": "standard", "label": "Standard" }, { "value": "heavy", "label": "Heavy" }] },
    { "id": "tone", "type": "enum", "role": "style", "label": "Tone", "description": "Word colour: ink for light frames, paper for dark ones, accent rides --brand.", "default": "ink", "options": [{ "value": "ink", "label": "Ink" }, { "value": "paper", "label": "Paper" }, { "value": "accent", "label": "Accent" }] }
  ]'
>
  <span>HELLO</span>
</div>

<style>
  .hf-catalog-blur-out-up {
    color: var(--hf-word-color, #18181b);
    font-family: Inter, system-ui, sans-serif;
    font-weight: 900;
    letter-spacing: -0.04em;
  }
  .hf-catalog-blur-out-up {
    display: inline-flex;
    gap: 12px;
    font-size: 56px;
    line-height: 1;
  }
  .hf-catalog-blur-out-up span {
    display: inline-block;
    transform: translate(
        calc(var(--hf-word-x, 0px) + var(--hf-word-y, 0px) * var(--hf-word-axis-x, 0)),
        calc(var(--hf-word-y, 0px) * var(--hf-word-axis-y, 1))
      )
      scale(var(--hf-word-scale, 1));
    filter: blur(calc(var(--hf-word-blur, 0px) * var(--hf-word-blur-scale, 1)));
    will-change: transform, filter, opacity;
  }
</style>

<script>
  (function () {
    "use strict";

    var vars =
      window.__hyperframes && window.__hyperframes.getVariables
        ? window.__hyperframes.getVariables()
        : {};

    // Unrecognised overrides return to their declared defaults.
    var axes = {
      up: { x: 0, y: 1 },
      down: { x: 0, y: -1 },
      left: { x: -1, y: 0 },
      right: { x: 1, y: 0 },
    };
    var reaches = { close: 0.5, standard: 1, far: 1.85 };
    var blurScales = { soft: 0.45, standard: 1, heavy: 2.2 };
    var tones = {
      ink: "#18181b",
      paper: "#fafafa",
      accent: "var(--brand, #34d399)",
    };

    function pick(table, value, fallback) {
      return Object.prototype.hasOwnProperty.call(table, value) ? value : fallback;
    }

    var axis = axes[pick(axes, vars.direction, "up")];
    var reach = reaches[pick(reaches, vars.distance, "standard")];
    var blurScale = blurScales[pick(blurScales, vars.blur, "standard")];
    var tone = tones[pick(tones, vars.tone, "ink")];

    var roots = document.querySelectorAll(".hf-catalog-blur-out-up");
    for (var i = 0; i < roots.length; i += 1) {
      roots[i].style.setProperty("--hf-word-axis-x", String(axis.x * reach));
      roots[i].style.setProperty("--hf-word-axis-y", String(axis.y * reach));
      roots[i].style.setProperty("--hf-word-blur-scale", String(blurScale));
      roots[i].style.setProperty("--hf-word-color", tone);
    }
  })();
</script>

<!--
  Timeline integration:
  tl.fromTo('.hf-catalog-blur-out-up span', { opacity: 0, '--hf-word-y': '22px', '--hf-word-scale': 0.92, '--hf-word-blur': '5px' }, { opacity: 1, '--hf-word-y': '0px', '--hf-word-scale': 1, '--hf-word-blur': '0px', duration: 0.3, stagger: 0.055, ease: 'power3.out' }, startTime);
-->
