<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Sheet Spring-Up</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }
      body {
        background: #0a0a0a;
      }
      .hf-ui-demo-canvas {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: linear-gradient(160deg, #0f3057 0%, #00587a 100%);
        font-family:
          ui-sans-serif,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }
      .hf-ssu-sheet {
        position: absolute;
        left: 626px;
        top: 330px;
        width: 668px;
        border-radius: 34px;
        background: #f9f9f9;
        color: #101010;
        box-shadow: 0 18px 42px rgba(0, 0, 0, 0.28);
        padding: 49px 43px 43px;
      }
      .hf-ssu-title {
        text-align: center;
        font-size: 44px;
        font-weight: 600;
        line-height: 1;
        letter-spacing: 0.2px;
      }
      .hf-ssu-body {
        margin-top: 24px;
        text-align: center;
        font-size: 29px;
        color: #313131;
      }
      .hf-ssu-actions {
        margin-top: 40px;
        display: flex;
        justify-content: center;
        gap: 60px;
        font-size: 34px;
      }
      .hf-ssu-actions .decline {
        color: #6f6f73;
      }
      .hf-ssu-actions .accept {
        color: #087a57;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div
      id="hf-ssu-demo-root"
      class="hf-ui-demo-canvas"
      data-composition-id="sheet-spring-up-demo"
      data-start="0"
      data-width="1920"
      data-height="1080"
      data-duration="3"
    >
      <section
        class="clip"
        data-start="0"
        data-duration="3"
        data-track-index="1"
        style="position: absolute; inset: 0"
      >
        <div class="hf-ssu-sheet" id="hf-ssu-demo-sheet">
          <div class="hf-ssu-title">Share</div>
          <div class="hf-ssu-body"><b>HyperFrames</b> would like to share a video</div>
          <div class="hf-ssu-actions">
            <span class="decline">Decline</span>
            <span class="accept">Accept</span>
          </div>
        </div>
      </section>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      /* the measured spring, verbatim */
      var SPRING = [
        [0.0, 1450, 0.0],
        [0.057, 1198, 0.13],
        [0.09, 903, 0.21],
        [0.123, 648, 0.36],
        [0.157, 437, 0.43],
        [0.19, 262, 0.5],
        [0.223, 120, 0.62],
        [0.257, 8, 0.78],
        [0.29, -76, 0.89],
        [0.323, -138, 1.0],
        [0.357, -175, null],
        [0.39, -191, null],
        [0.423, -192, null],
        [0.457, -181, null],
        [0.49, -159, null],
        [0.523, -131, null],
        [0.557, -100, null],
        [0.59, -68, null],
        [0.623, -41, null],
        [0.657, -18, null],
        [0.69, -5, null],
        [0.723, 0, null],
      ];
      var START = 0.4;
      SPRING.forEach(function (s) {
        var props = { y: s[1] };
        if (s[2] !== null) props.autoAlpha = s[2];
        tl.set("#hf-ssu-demo-sheet", props, START + s[0]);
      });
      tl.set({}, {}, 3);

      window.__timelines["sheet-spring-up-demo"] = tl;
    </script>
  </body>
</html>
