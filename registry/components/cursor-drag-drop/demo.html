<!doctype html>
<!--
  Drag and Drop Cursor, standalone demo: mounts cursor-drag-drop.html full-frame over a
  soft backdrop. The board and every reaction live inside the component.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Drag and Drop Cursor, Demo</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background:
          radial-gradient(1100px 700px at 15% 0%, #dfe3ff 0%, transparent 60%),
          radial-gradient(900px 700px at 100% 100%, #ffe3ec 0%, transparent 55%), #f6f7fb;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="cursor-drag-drop-demo"
      data-start="0"
      data-width="1920"
      data-height="1080"
      data-duration="5"
    >
      <div
        class="clip"
        id="cursor-drag-drop"
        data-composition-id="cursor-drag-drop"
        data-composition-src="./cursor-drag-drop.html"
        data-variable-values='{"card_label":"Fix checkout validation","accent":"#5b5bf6","tone":"light"}'
        data-start="0"
        data-duration="5"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
        style="position: absolute; inset: 0; width: 1920px; height: 1080px"
      ></div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });
      window.__timelines["cursor-drag-drop-demo"] = tl;
    </script>
  </body>
</html>
