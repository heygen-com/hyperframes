<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Typewriter - Demo</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }
      #demo {
        width: 1920px;
        height: 1080px;
        display: grid;
        place-items: center;
        background: #f7f7f8;
        font-family: Inter, system-ui, sans-serif;
      }
      .demo-frame {
        display: grid;
        place-items: center;
        min-width: 900px;
        min-height: 500px;
        padding: 64px;
        /* ponytail: scale-up only; GSAP targets .hf-catalog-typewriter with CSS vars, not transforms */
        transform: scale(2);
      }
      .hf-catalog-typewriter {
        color: #18181b;
        font-family: Inter, system-ui, sans-serif;
        font-weight: 900;
        letter-spacing: -0.04em;
      }
      .hf-catalog-typewriter {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font:
          800 52px/1.2 ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
      }
      .hf-catalog-typewriter span {
        display: inline-block;
        max-width: calc(var(--hf-type-progress, 1) * 100%);
        overflow: hidden;
        white-space: nowrap;
      }
      .hf-catalog-typewriter i {
        width: 3px;
        height: 52px;
        border-radius: 999px;
        background: #18181b;
        opacity: var(--hf-caret-opacity, 1);
      }
    </style>
  </head>
  <body>
    <div
      id="demo"
      data-composition-id="typewriter-demo"
      data-start="0"
      data-width="1920"
      data-height="1080"
      data-duration="5"
    >
      <div class="demo-frame">
        <div
          class="hf-catalog-typewriter"
          data-composition-variables='[
    { "id": "text", "type": "string", "role": "content", "label": "Text", "description": "Line that types itself out character by character.", "default": "hyperframes add typewriter" },
    { "id": "tone", "type": "enum", "role": "style", "label": "Tone", "description": "Colour of the text and the caret: ink for light frames, paper for dark ones, accent rides --brand.", "default": "ink", "options": [{ "value": "ink", "label": "Ink" }, { "value": "paper", "label": "Paper" }, { "value": "accent", "label": "Accent" }] },
    { "id": "caret", "type": "enum", "role": "style", "label": "Caret", "description": "Caret shape: a thin rule, a terminal-style block, or no caret at all.", "default": "line", "options": [{ "value": "line", "label": "Line" }, { "value": "block", "label": "Block" }, { "value": "none", "label": "None" }] }
  ]'
        >
          <span>hyperframes add typewriter</span><i></i>
        </div>
      </div>
      <script>
        (function () {
          "use strict";

          var vars =
            window.__hyperframes && window.__hyperframes.getVariables
              ? window.__hyperframes.getVariables()
              : {};

          // Unrecognised overrides return to their declared defaults.
          var tones = {
            ink: "#18181b",
            paper: "#fafafa",
            accent: "var(--brand, #34d399)",
          };
          var carets = {
            line: { width: "3px", display: "block" },
            block: { width: "22px", display: "block" },
            none: { width: "3px", display: "none" },
          };

          function pick(table, value, fallback) {
            return Object.prototype.hasOwnProperty.call(table, value) ? value : fallback;
          }

          var tone = tones[pick(tones, vars.tone, "ink")];
          var caret = carets[pick(carets, vars.caret, "line")];
          var text = typeof vars.text === "string" && vars.text !== "" ? vars.text : null;

          var roots = document.querySelectorAll(".hf-catalog-typewriter");
          for (var i = 0; i < roots.length; i += 1) {
            var root = roots[i];
            root.style.setProperty("--hf-type-color", tone);
            root.style.setProperty("--hf-caret-width", caret.width);
            root.style.setProperty("--hf-caret-display", caret.display);

            var line = root.querySelector("span");
            if (text !== null && line) {
              line.textContent = text;
            }
          }
        })();
      </script>
      <script>
        const tl = gsap.timeline({ paused: true });
        const startTime = 0.5;
        tl.fromTo(
          ".hf-catalog-typewriter",
          { "--hf-type-progress": 0 },
          { "--hf-type-progress": 1, duration: 1.2, ease: "steps(28)" },
          startTime,
        );
        tl.to(
          ".hf-catalog-typewriter i",
          { "--hf-caret-opacity": 0.2, duration: 0.24, repeat: 7, yoyo: true, ease: "none" },
          startTime + 0.2,
        );
        tl.set({}, {}, 5);
        window.__timelines = window.__timelines || {};
        window.__timelines["typewriter-demo"] = tl;
      </script>
    </div>
    <style>
      .hf-catalog-typewriter {
        color: var(--hf-type-color, #18181b);
        font-family: Inter, system-ui, sans-serif;
        font-weight: 900;
        letter-spacing: -0.04em;
      }
      .hf-catalog-typewriter {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        font:
          800 42px/1 ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
      }
      .hf-catalog-typewriter span {
        display: inline-block;
        max-width: calc(var(--hf-type-progress, 1) * 100%);
        overflow: hidden;
        white-space: nowrap;
      }
      .hf-catalog-typewriter i {
        display: var(--hf-caret-display, block);
        width: var(--hf-caret-width, 3px);
        height: 42px;
        border-radius: 999px;
        background: var(--hf-type-color, #18181b);
        opacity: var(--hf-caret-opacity, 1);
      }
    </style>
  </body>
</html>
