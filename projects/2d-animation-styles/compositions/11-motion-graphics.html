    <script>
      (function () {
        window.__timelines = window.__timelines || {};
        var tl = gsap.timeline({ paused: true });

        // The count-up is a tween on a proxy, not on text content, so it stays
        // seek-safe: any frame recomputes the same integer from timeline time.
        var counter = { v: 0 };
        var statEl = document.getElementById("mg-stat");
        tl.to(
          counter,
          {
            v: 24,
            duration: 1.5,
            ease: "power2.out",
            onUpdate: function () {
              statEl.textContent = Math.round(counter.v);
            },
          },
          0.25,
        );

        tl.from(
          "#beat-motiongfx .mg-stat",
          { scale: 0.7, opacity: 0, duration: 0.6, ease: "back.out(1.6)" },
          0.15,
        );
        tl.from(
          "#beat-motiongfx .mg-word",
          { y: 90, opacity: 0, duration: 0.6, ease: "power3.out", stagger: 0.08 },
          0.7,
        );
        tl.to("#mg-rule", { width: 520, duration: 0.9, ease: "power3.inOut" }, 1.3);
        // Deliberately NOT tweening letter-spacing: it reflows text and snaps
        // glyphs to integer pixels under the seek-by-frame capture engine.
        tl.to(
          "#beat-motiongfx .mg-stat",
          { scale: 1.03, transformOrigin: "50% 100%", duration: 1.4, ease: "sine.inOut" },
          1.6,
        );

        tl.from(
          "#beat-motiongfx .beat-label",
          { opacity: 0, x: -26, duration: 0.5, ease: "power2.out" },
          0.2,
        );

        window.__timelines["motiongfx"] = tl;
      })();
