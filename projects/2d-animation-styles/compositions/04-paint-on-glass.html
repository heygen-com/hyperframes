    <img

      class="pg-canvas clip"
      data-start="0"
      data-duration="3.5"

    <div class="pg-caveat">

    <div class="beat-label">

    <script>

        // The one painterly path that is genuinely keyframeable: kuwahara

          "#beat-paintglass .beat-label",
          { opacity: 0, x: -26, duration: 0.5, ease: "power2.out" },

        window.__timelines["paintglass"] = tl;
