<template>
  <div
    id="beat-collage"
    data-composition-id="collage"
    data-width="1920"
    data-height="1080"
    data-duration="3.5"
    style="position: absolute; inset: 0"
  >
    <style>
      #beat-collage {
        background: #ded5c4;
        overflow: hidden;
      }
      #beat-collage .beat-label {
        position: absolute;
        left: 96px;
        bottom: 88px;
        color: #1d1a15;
      }
      #beat-collage .beat-num {
        font-size: 22px;
        letter-spacing: 0.34em;
        color: #6f4a2c;
        margin-bottom: 14px;
      }
      #beat-collage .beat-name {
        font-size: 62px;
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      #beat-collage .beat-tech {
        font-size: 26px;
        font-weight: 300;
        color: #443e34;
        margin-top: 12px;
      }
      #beat-collage .cl-stage {
        position: absolute;
        inset: 0;
        isolation: isolate;
      }
      #beat-collage .cl-piece {
        position: absolute;
        mix-blend-mode: multiply;
      }
      #beat-collage .cl-type {
        position: absolute;
        font-weight: 800;
        letter-spacing: -0.02em;
        color: #1d1a15;
        background: #f2ead8;
        padding: 6px 18px;
        box-shadow: 4px 6px 0 rgba(40, 32, 20, 0.35);
      }
    </style>

    <div class="cl-stage" id="cl-stage"></div>

    <div class="beat-label">
      <div class="beat-num">15 / CUT-OUT</div>
      <div class="beat-name">Collage</div>
      <div class="beat-tech">Layered chips, multiply blend, seeded crooked placement</div>
    </div>

    <script>
      (function () {
        window.__timelines = window.__timelines || {};
        var tl = gsap.timeline({ paused: true });

        function mulberry32(a) {
          return function () {
            a |= 0;
            a = (a + 0x6d2b79f5) | 0;
            var t = Math.imul(a ^ (a >>> 15), 1 | a);
            t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
          };
        }
        var rnd = mulberry32(31337);
        var stage = document.getElementById("cl-stage");
        var items = [];

        // Torn paper/photo fragments. multiply is what makes overlaps read as
        // layered physical material instead of stacked opaque rectangles.
        var TONES = ["#b9563f", "#3f5a6e", "#d9a441", "#7d8b5a", "#8f7a9e", "#c5b294"];
        for (var i = 0; i < 16; i++) {
          var el = document.createElement("div");
          el.className = "cl-piece";
          var w = 180 + rnd() * 300,
            h = 130 + rnd() * 240;
          el.style.width = w + "px";
          el.style.height = h + "px";
          el.style.left = 180 + rnd() * 1380 + "px";
          el.style.top = 150 + rnd() * 520 + "px";
          el.style.background = TONES[Math.floor(rnd() * TONES.length) % TONES.length];
          el.style.opacity = (0.62 + rnd() * 0.3).toFixed(2);
          var pts = [];
          for (var k = 0; k <= 8; k++) pts.push(k * 12.5 + "% " + (rnd() * 6).toFixed(1) + "%");
          for (var k2 = 0; k2 <= 5; k2++)
            pts.push((100 - rnd() * 5).toFixed(1) + "% " + k2 * 20 + "%");
          for (var k3 = 8; k3 >= 0; k3--)
            pts.push(k3 * 12.5 + "% " + (100 - rnd() * 6).toFixed(1) + "%");
          for (var k4 = 5; k4 >= 0; k4--) pts.push((rnd() * 5).toFixed(1) + "% " + k4 * 20 + "%");
          el.style.clipPath = "polygon(" + pts.join(",") + ")";
          stage.appendChild(el);
          items.push({ el: el, rot: (rnd() - 0.5) * 26, d: rnd() });
        }

        var WORDS = [
          ["CUT", 62, 300, 300],
          ["&", 44, 700, 250],
          ["PASTE", 70, 840, 620],
        ];
        WORDS.forEach(function (spec) {
          var t = document.createElement("div");
          t.className = "cl-type";
          t.innerHTML = spec[0];
          t.style.fontSize = spec[1] + "px";
          t.style.left = spec[2] + "px";
          t.style.top = spec[3] + "px";
          t.style.transform = "rotate(" + ((rnd() - 0.5) * 14).toFixed(2) + "deg)";
          stage.appendChild(t);
          items.push({ el: t, rot: (rnd() - 0.5) * 14, d: rnd(), type: true });
        });

        // Pieces land crooked, in seeded order, on discrete steps.
        items.forEach(function (it) {
          var at = 0.1 + it.d * 2.1;
          tl.fromTo(
            it.el,
            { opacity: 0, scale: 1.25, rotation: it.rot - 12, y: -40 },
            {
              opacity: it.type ? 1 : Number(it.el.style.opacity || 1),
              scale: 1,
              rotation: it.rot,
              y: 0,
              duration: 0.28,
              ease: "steps(2)",
            },
            at,
          );
        });

        tl.from(
          "#beat-collage .beat-label",
          { opacity: 0, x: -26, duration: 0.5, ease: "power2.out" },
          0.2,
        );

        window.__timelines["collage"] = tl;
      })();
    </script>
  </div>
</template>
