  <script>
    /* Pacing: each scene's timeline is written in its first-cut times; insertHolds(tl, [[t, extra], ...])
       pushes everything that starts at or after t by `extra` seconds (negative pulls it in). HOLDS comes
       from tools/build_audio.py, which also moves the voice clips and sound cues by the same map. */
    window.insertHolds = function (tl, holds) {
      holds.slice().sort(function (a, b) { return b[0] - a[0]; }).forEach(function (h) {
        tl.getChildren(false, true, true).forEach(function (c) {
          if (c.startTime() >= h[0] - 1e-6) c.startTime(c.startTime() + h[1]);
        });
      });
    };
