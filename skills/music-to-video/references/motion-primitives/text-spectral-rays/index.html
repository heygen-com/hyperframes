<!doctype html>
<html
  lang="en"
  data-composition-variables='[
    {"id":"text",       "type":"string", "label":"Wordmark",           "default":"SPECTRAL"},
    {"id":"textColor",  "type":"color",  "label":"Wordmark fill",       "default":"#f6ff7a"},
    {"id":"bgColor",    "type":"color",  "label":"Stage background",    "default":"#000000"},
    {"id":"sweepSpeed", "type":"number", "label":"Light sweep speed", "default":1, "min":0.2, "max":3, "step":0.1}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>text_spectral_rays</title>
    <script src="../assets/gsap.min.js"></script>
    <style>
      :root {
        --hg-violet: #7c3aed;
        --hg-violet-2: #a855f7;
        --hg-bg: #000000;
        --hg-fg: #f5f5fa;
        --hg-dim: #6b6b78;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
        font-family: "Inter", system-ui, sans-serif;
        color: var(--hg-fg);
        -webkit-font-smoothing: antialiased;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="4"
      data-width="1920"
      data-height="1080"
    >
      <div
        id="scene"
        class="clip"
        data-composition-id="text-spectral-rays"
        data-composition-src="scene.html"
        data-start="0"
        data-duration="4"
        data-track-index="1"
      ></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
