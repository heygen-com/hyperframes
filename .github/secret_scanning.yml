# Generic (AI-detected) secret scanning reads the generated skills manifest's per-skill
# 16-hex content hashes as passwords, and every regeneration raises new alerts. The file
# is written by packages/cli/scripts/gen-skills-manifest.ts and holds only skill names,
# content hashes and file counts. Provider-pattern scanning and push protection still
# cover every other path.
paths-ignore:
  - "skills-manifest.json"
