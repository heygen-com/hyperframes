name: Install ffmpeg (Linux)
description: >-
  Put a pinned static ffmpeg and ffprobe on PATH, restored from the Actions
  cache or downloaded from BtbN/FFmpeg-Builds. Replaces an apt install whose
  mirror took up to 10 minutes and timed out test shards.

inputs:
  release-url:
    description: >-
      BtbN/FFmpeg-Builds linux64 tarball. Bump the tag, filename and sha256
      together.
    required: false
    default: https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-04-30-13-44/ffmpeg-n7.1.3-46-g957b06a788-linux64-gpl-7.1.tar.xz
  sha256:
    description: sha256 of the tarball, from the release's checksums.sha256.
    required: false
    default: 15a62cc3facdacfa5ce1fbe80f898fc77f159bdd5f3ed6b60dd2c970d52b3f19

runs:
  using: composite
  steps:
    - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ~/.cache/hf-ffmpeg
        key: ffmpeg-${{ runner.os }}-${{ inputs.sha256 }}

    - name: Install ffmpeg
      shell: bash
      env:
        URL: ${{ inputs.release-url }}
        SHA256: ${{ inputs.sha256 }}
      run: |
        set -euo pipefail
        archive="$HOME/.cache/hf-ffmpeg/${URL##*/}"
        mkdir -p "${archive%/*}"
        if ! echo "$SHA256  $archive" | sha256sum -c --quiet >/dev/null 2>&1; then
          # Each attempt aborts after 40 s, or sooner if under 1 MB/s for 15 s.
          curl -fsSL --retry 2 --retry-all-errors --connect-timeout 10 --max-time 40 \
            --speed-limit 1000000 --speed-time 15 -o "$archive" "$URL"
          echo "$SHA256  $archive" | sha256sum -c --quiet
        fi
        bin="$RUNNER_TEMP/ffmpeg-bin"
        mkdir -p "$bin"
        tar -xJf "$archive" -C "$bin" --strip-components=2 --wildcards '*/bin/ffmpeg' '*/bin/ffprobe'
        echo "$bin" >> "$GITHUB_PATH"
        "$bin/ffmpeg" -version | head -1
