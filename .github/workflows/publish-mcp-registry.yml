name: Publish to MCP Registry

# Lists the hosted HyperFrames MCP (server.json) in the official MCP registry as com.heygen/*: the registry checks a
# signature against heygen.com's MCPv1 TXT record, and only the mcp-registry environment holds the key. Its GitHub
# login is not used: that grants io.github.heygen-com/* to an OIDC token from any job in any heygen-com repo.
# The registry rejects a version it already has: to change the listing, edit server.json and raise "version".
# Steps follow https://modelcontextprotocol.io/registry/authentication (DNS).

permissions: {}

on:
  push:
    branches: [main]
    paths: [server.json]
  workflow_dispatch:

jobs:
  publish:
    # The environment admits only main.
    if: github.ref == 'refs/heads/main'
    environment: mcp-registry
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      MCP_PUBLISHER_VERSION: v1.8.9
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"

      - name: Log in to the MCP registry
        env:
          MCP_PRIVATE_KEY: ${{ secrets.MCP_PRIVATE_KEY }}
        run: ./mcp-publisher login dns --domain heygen.com --private-key "$MCP_PRIVATE_KEY"

      - name: Publish server.json
        run: ./mcp-publisher publish
