name: Publish to MCP Registry

# Lists the hosted HyperFrames MCP (server.json) in the official MCP registry as com.heygen/hyperframes.
# The registry grants com.heygen/* only to a request signed with the key whose public half is in the TXT
# record on heygen.com, and that key is a secret of the main-only mcp-registry environment. The older
# io.github.heygen-com/* name was granted to a GitHub token from any workflow in any heygen-com repository.
# The registry rejects a version it already has: to change the listing, edit server.json and raise "version".
# Steps follow https://modelcontextprotocol.io/registry/authentication

permissions: {}

on:
  push:
    branches: [main]
    paths: [server.json]
  workflow_dispatch:

jobs:
  publish:
    # The environment admits only main.
    if: github.ref == 'refs/heads/main'
    environment: mcp-registry
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: ./.github/actions/install-mcp-publisher
        with:
          version: v1.8.9

      # v1.8.9 reads the key only from --private-key; the value comes from the environment, which Actions masks.
      - name: Log in to the MCP registry as heygen.com
        env:
          MCP_PRIVATE_KEY: ${{ secrets.MCP_PRIVATE_KEY }}
        run: ./mcp-publisher login dns --domain heygen.com --private-key "$MCP_PRIVATE_KEY"

      - name: Publish server.json
        run: ./mcp-publisher publish
