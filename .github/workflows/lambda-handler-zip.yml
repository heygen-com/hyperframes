name: Lambda handler ZIP

permissions:
  contents: read

# The x86 handler ZIP sits close to its unzipped-size gate, and the handler bundles the producer, engine and core,
# so a change there can push it over. Build it on those PRs, so that fails before merge, not in the release job.
on:
  pull_request:
    paths:
      - "packages/aws-lambda/**"
      - "packages/producer/src/**"
      - "packages/engine/src/**"
      - "packages/core/src/**"
      - "packages/parsers/src/**"
      - "bun.lock"
      - ".github/workflows/lambda-handler-zip.yml"

concurrency:
  group: lambda-handler-zip-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 4
    outputs:
      release_only: ${{ steps.release.outputs.release_only }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Find a release-only diff
        id: release
        uses: ./.github/actions/release-only-diff

  handler-zip:
    name: Handler ZIP size
    needs: changes
    # A release PR changes versions and notes only; a failed change detection must not skip the build.
    if: ${{ !cancelled() && needs.changes.outputs.release_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run --cwd packages/aws-lambda build:zip
