name: Player Safari audio

permissions:
  contents: read

env:
  HYPERFRAMES_NO_TELEMETRY: "1"

on:
  pull_request:
    paths:
      - "packages/core/src/runtime/**"
      - "packages/player/tests/playbench/**"
      - ".github/workflows/player-safari-audio.yml"
  workflow_dispatch:

concurrency:
  group: player-safari-audio-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audio:
    name: "Audio in real Safari: no playhead stops, no seek loop"
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - run: bun install --frozen-lockfile

      - run: |
          bun run --filter @hyperframes/parsers build
          bun run --filter @hyperframes/core build
          bun run --filter @hyperframes/player build

      - name: Generate media
        run: |
          brew install ffmpeg
          bash packages/player/tests/playbench/make-media.sh

      - name: Enable safaridriver
        run: sudo safaridriver --enable

      - name: Play both edits in Safari
        working-directory: packages/player/tests/playbench
        run: |
          sw_vers
          # a failed edit must not hide the other one's numbers
          status=0
          for edit in primary tentake; do
            bun webkit-stops.ts --browser safari --edit "$edit" --runs 3 --assert | tee "safari-$edit.log" || status=1
          done
          exit $status

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: player-safari-audio
          path: packages/player/tests/playbench/safari-*.log
          if-no-files-found: warn
          retention-days: 30
