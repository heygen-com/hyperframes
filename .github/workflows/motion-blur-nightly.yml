name: motion-blur-nightly

permissions:
  contents: read

env:
  HYPERFRAMES_NO_TELEMETRY: "1"

concurrency:
  group: motion-blur-nightly
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      seeds:
        description: "Seeds to run, a comma list or a-b range (default: today's 200)."
        type: string
        default: ""
  schedule:
    # Daily at 08:41 UTC, off the :00 pile and away from regression.yml's 06:17.
    - cron: "41 8 * * *"

jobs:
  plan:
    name: Plan seeds
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      chunks: ${{ steps.plan.outputs.chunks }}
    steps:
      # Today's 200 seeds are days-since-2026-01-01 * 200 onward, in 4 chunks of 50.
      - id: plan
        env:
          SEEDS: ${{ inputs.seeds }}
        run: |
          if [ -n "$SEEDS" ]; then
            chunks="$(jq -cn --arg seeds "$SEEDS" '[{id: "custom", seeds: $seeds}]')"
          else
            days=$(( ($(date -u +%s) - $(date -u -d 2026-01-01 +%s)) / 86400 ))
            start=$(( days * 200 ))
            chunks="$(jq -cn --argjson start "$start" '[range(0; 4) | ($start + . * 50) as $from | {id: ($from | tostring), seeds: "\($from)-\($from + 49)"}]')"
          fi
          echo "chunks=$chunks" >> "$GITHUB_OUTPUT"
          echo "$chunks"

  generated:
    name: Generated compositions (${{ matrix.flavour }}, ${{ matrix.chunk.seeds }})
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        flavour: [pin, stable]
        chunk: ${{ fromJSON(needs.plan.outputs.chunks) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: workspace
        uses: ./.github/actions/setup-test-workspace
        with:
          engine: "true"
          headless-shell: "true"
      - id: pin
        if: matrix.flavour == 'pin'
        shell: bash
        run: |
          dir="$RUNNER_TEMP/headless-shell-pin"
          bunx @puppeteer/browsers@3.2.2 install chrome-headless-shell@153.0.8010.36 --path "$dir"
          echo "path=$(find "$dir" -type f -name chrome-headless-shell | head -n 1)" >> "$GITHUB_OUTPUT"
      - name: Run the generated compositions
        working-directory: packages/engine
        env:
          HYPERFRAMES_BROWSER_PATH: ${{ matrix.flavour == 'pin' && steps.pin.outputs.path || steps.workspace.outputs.headless-shell-path }}
          HF_BLUR_SEEDS: ${{ matrix.chunk.seeds }}
          HF_BLUR_FAILURES_FILE: ${{ github.workspace }}/blur-nightly-failures.json
          HF_BLUR_REQUIRED: "1"
        run: bunx vitest run --project browser src/services/captureMotionBlur.generated.browser.test.ts
      - name: Keep the failing seeds
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: blur-nightly-failures-${{ matrix.flavour }}-${{ matrix.chunk.id }}
          path: blur-nightly-failures.json
          if-no-files-found: ignore

  report:
    name: Open issues for failing seeds
    needs: [plan, generated]
    if: always() && needs.generated.result == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: blur-nightly-failures-*
          path: failures
      - name: One issue per failing seed
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MAX_ISSUES: "25"
        run: |
          shopt -s nullglob
          files=(failures/*/blur-nightly-failures.json)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::warning::A job failed without naming a failing seed; see $RUN_URL"
            exit 0
          fi
          for f in "${files[@]}"; do
            name="$(basename "$(dirname "$f")")"
            flavour="${name#blur-nightly-failures-}"
            jq -c --arg flavour "${flavour%%-*}" '.[] | . + {flavour: $flavour}' "$f"
          done | jq -sc 'group_by(.seed) | map({seed: .[0].seed, features: .[0].features, flavours: map(.flavour), problems: (map(.problems) | add | unique)}) | .[]' > seeds.jsonl
          opened=0
          while read -r row; do
            seed="$(jq -r .seed <<< "$row")"
            title="motion blur nightly: seed $seed"
            if gh issue list --state open --search "\"$title\" in:title" --json title --jq '.[].title' | grep -Fxq "$title"; then
              echo "skipping seed $seed: an open issue exists"
              continue
            fi
            if [ "$opened" -ge "$MAX_ISSUES" ]; then
              echo "::warning::More than $MAX_ISSUES failing seeds; not opening an issue for seed $seed"
              continue
            fi
            {
              echo "Seed $seed fails the pixel invariants on \`auto\`."
              echo
              echo "- Features: $(jq -r '.features | join(", ")' <<< "$row")"
              echo "- Chrome flavours: $(jq -r '.flavours | join(", ")' <<< "$row")"
              echo "- Run: $RUN_URL"
              echo
              echo "Reproduce from \`packages/engine\`:"
              echo
              echo '```sh'
              echo "HF_BLUR_SEEDS=$seed bunx vitest run --project browser src/services/captureMotionBlur.generated.browser.test.ts"
              echo '```'
              echo
              echo "Findings:"
              echo
              jq -r '.problems[] | "- " + .' <<< "$row"
            } > body.md
            gh issue create --title "$title" --body-file body.md --label bug --label area/quality
            opened=$(( opened + 1 ))
          done < seeds.jsonl
