name: tmp prune probe
on: pull_request
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: bash scripts/ci/install-workspace-dependencies.sh
      - run: bun run --filter '@hyperframes/{parsers,lint,studio-server}' build && bun run --cwd packages/core build
      - name: kernel and mtime probe
        run: |
          uname -r
          node -e '
            const fs = require("fs"); const f = "/tmp/mtime-probe"; fs.writeFileSync(f, "0");
            for (const statFirst of [false, true]) {
              let ahead = 0, max = 0; const n = 20000;
              for (let i = 0; i < n; i++) {
                if (statFirst) fs.statSync(f);
                fs.writeFileSync(f, String(i)); const now = Date.now(); const m = fs.statSync(f).mtimeMs;
                if (m > now) { ahead++; max = Math.max(max, m - now); }
              }
              console.log(`statFirst=${statFirst}: ${ahead}/${n} writes have mtime after Date.now(), max ${max.toFixed(3)} ms`);
            }'
      - name: 200 runs of main's test and of the fixed test, 4 workers each
        working-directory: packages/studio-server
        run: |
          git show origin/main:packages/studio-server/src/history/pruneHistories.test.ts > src/history/pruneHistoriesMain.test.ts
          loop() {
            file=$1; seq 4 | xargs -P4 -I{} bash -c '
              f=0; for i in $(seq 50); do npx vitest run '"$file"' > /tmp/out-{}-$i 2>&1 || { f=$((f+1)); grep -m1 -a "×" /tmp/out-{}-$i; }; done; echo "worker {} failed $f/50"'
          }
          echo "== main's test"; loop src/history/pruneHistoriesMain.test.ts
          echo "== fixed test"; loop src/history/pruneHistories.test.ts
