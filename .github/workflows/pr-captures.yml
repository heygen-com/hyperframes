name: PR captures

permissions:
  contents: read
  pull-requests: read

# Runs on every PR (no path filter) so it can be a required check; the script passes when neither package changed.
on:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: [main]

concurrency:
  group: pr-captures-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  captures:
    name: Studio and player captures
    # A merge group has no PR body to read; the queued PR passed this check already.
    if: github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - id: pr
        run: node scripts/ci/resolve-workflow-pr.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Require Before and After captures
        env:
          PR_BODY: ${{ fromJSON(steps.pr.outputs.pr).body }}
          PR_NUMBER: ${{ fromJSON(steps.pr.outputs.pr).number }}
          BASE_REF: ${{ fromJSON(steps.pr.outputs.pr).base.ref }}
          HEAD_REPO: ${{ fromJSON(steps.pr.outputs.pr).head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ fromJSON(steps.pr.outputs.pr).head.sha }}
        run: node scripts/check-pr-captures.mjs --base "origin/$BASE_REF" --head "$HEAD_SHA"
