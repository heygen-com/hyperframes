name: Windows render verification

permissions:
  contents: read

# Suppress hyperframes CLI telemetry from HeyGen's own CI runs.
# External users' CI continues to emit telemetry unless they set this themselves.
env:
  HYPERFRAMES_NO_TELEMETRY: "1"

# Manually triggered smoke test that renders a HyperFrames composition on a
# real Windows runner. Proves the PR #336 `where ffmpeg` fix actually works
# end-to-end: FFmpeg is discovered natively on Windows, Chrome is installed
# and launched, frames are captured, and an MP4 is produced — without Docker
# or WSL.

on:
  pull_request:
    # `edited` is required so the workflow re-fires when a PR's base ref is
    # set back to `main` after a Graphite stack restack momentarily flips
    # the base off of `main`. Without it, `pull_request` triggers are not
    # re-evaluated on `base_ref_changed`, leaving required checks skipped
    # for that head SHA forever.
    types: [opened, synchronize, reopened, edited]
    branches: [main]
  push:
    branches: [main]
  # Dispatch on the ref to render: the run then checks out that ref and writes only that ref's cache.
  workflow_dispatch:

concurrency:
  group: windows-render-${{ github.ref }}
  # A body or title edit queues behind running checks instead of cancelling them.
  cancel-in-progress: ${{ github.event.action != 'edited' || github.event.changes.base != null }}

jobs:
  probe:
    name: Probe gsapSoftReloadWait first row
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Disable Windows Defender real-time monitoring
        shell: pwsh
        continue-on-error: true
        run: Set-MpPreference -DisableRealtimeMonitoring $true
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - shell: pwsh
        run: bun install --frozen-lockfile --linker=hoisted
      - shell: pwsh
        run: |
          bun run --filter '@hyperframes/{parsers,lint,studio-server}' build
          bun run --cwd packages/core build
      - name: Fixed file, 3 runs in a row, both modes
        shell: pwsh
        run: |
          for ($i = 1; $i -le 3; $i++) {
            $out = bun run --cwd packages/studio test -- src/utils/gsapSoftReloadWait.browser.test.ts --maxWorkers=2 --reporter=verbose 2>&1 | Out-String
            $code = $LASTEXITCODE
            $out -split "`n" | Where-Object { $_ -match 'Tests  |FAIL|AssertionError|launch 1/2 ready' } | ForEach-Object { "full ${i}: $_" }
            "full $i exit=$code"
          }
      - name: Fixed play row, 16 runs under CPU burners
        shell: pwsh
        env:
          HF_PARITY_MODE: unsealed
        run: |
          for ($i = 1; $i -le 16; $i++) {
            $jobs = 1..4 | ForEach-Object { Start-Job { while ($true) { $x = 1 } } }
            $out = bun run --cwd packages/studio test -- src/utils/gsapSoftReloadWait.browser.test.ts -t "play,ok" --maxWorkers=2 --reporter=verbose 2>&1 | Out-String
            $code = $LASTEXITCODE
            $jobs | Stop-Job -PassThru | Remove-Job
            $out -split "`n" | Where-Object { $_ -match 'soft-wait\] unsealed play|Tests  ' } | ForEach-Object { "play ${i}: $_" }
            "play $i exit=$code"
          }
      - name: Red first, plugin request 1.2 s late, fixed then main's test file
        shell: pwsh
        env:
          HF_PARITY_MODE: unsealed
          HF_PROBE_DELAY_MS: "1200"
        run: |
          $out = bun run --cwd packages/studio test -- src/utils/gsapSoftReloadWait.browser.test.ts -t "unsealed ok$" --maxWorkers=2 --reporter=verbose 2>&1 | Out-String
          "fixed exit=$LASTEXITCODE"
          $out -split "`n" | Where-Object { $_ -match 'Tests  |FAIL|AssertionError| ok ' } | ForEach-Object { "fixed: $_" }
          git fetch -q --depth 1 origin ca64f8b5de709c56694ec184e5f8b8c0b25c1041
          git show FETCH_HEAD:packages/studio/src/utils/gsapSoftReloadWait.browser.test.ts | Set-Content -Encoding utf8 packages/studio/src/utils/gsapSoftReloadWait.browser.test.ts
          $out = bun run --cwd packages/studio test -- src/utils/gsapSoftReloadWait.browser.test.ts -t "unsealed ok$" --maxWorkers=2 --reporter=verbose 2>&1 | Out-String
          "main exit=$LASTEXITCODE"
          $out -split "`n" | Where-Object { $_ -match 'Tests  |FAIL|AssertionError| ok ' } | ForEach-Object { "main: $_" }
          exit 0
