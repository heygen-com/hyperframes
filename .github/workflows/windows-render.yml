name: Windows render verification

# probe/secpub-recordlock: loops the received-files lock test on windows-latest, alone and under CPU load.
on:
  workflow_dispatch:

jobs:
  recordlock:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Disable Windows Defender real-time monitoring
        shell: pwsh
        continue-on-error: true
        run: Set-MpPreference -DisableRealtimeMonitoring $true
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Install dependencies
        shell: pwsh
        run: bun install --frozen-lockfile --linker=hoisted
      - name: Build test prerequisites
        shell: pwsh
        run: |
          bun run --filter '@hyperframes/{parsers,lint,studio-server}' build
          bun run --cwd packages/core build
      - name: Loop the lock test, alone then under load
        shell: pwsh
        working-directory: packages/cli
        run: |
          $test = "src/utils/privateProjectFile.test.ts"
          $name = "waits for another writer"
          function Loop($label, $n) {
            $fails = 0
            for ($i = 1; $i -le $n; $i++) {
              $out = npx vitest run $test -t $name 2>&1 | Out-String
              $line = ($out -split "`n" | Where-Object { $_ -match "PROBE" }) -join " "
              if ($LASTEXITCODE -ne 0) { $fails++; if ($fails -le 2) { Write-Host (($out -split "`n" | Select-Object -Last 40) -join "`n") } }
              Write-Host "$label $i exit=$LASTEXITCODE $line"
            }
            Write-Host "== $label fails=$fails of $n"
          }
          Loop "alone" 25
          $cores = [Environment]::ProcessorCount
          $burners = 1..($cores * 2) | ForEach-Object { Start-Job { while ($true) { $x = 1; for ($j = 0; $j -lt 1000000; $j++) { $x = $x * 1.0000001 } } } }
          Write-Host "burners=$($burners.Count) on $cores cores"
          Loop "loaded" 25
          $burners | Stop-Job
          $burners | Remove-Job -Force
