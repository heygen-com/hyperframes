name: Windows render verification

permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: windows-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: mkdir on drive roots and existing folders
        shell: pwsh
        run: |
          node --version
          Get-PSDrive -PSProvider FileSystem | Select-Object Name, Root | Format-Table | Out-String | Write-Host
          New-Item -ItemType Directory -Force D:\dxw-existing | Out-Null
          $js = @'
          const fs = require("node:fs");
          const tries = [["D:\\", true], ["D:\\", false], ["C:\\", true], ["D:\\dxw-existing", true], ["D:\\dxw-new\\a", true], ["D:/", true]];
          (async () => {
            for (const [dir, recursive] of tries) {
              await fs.promises.mkdir(dir, { recursive }).then(
                (r) => console.log(`mkdir ${JSON.stringify(dir)} recursive=${recursive}: ok ${r ?? ""}`),
                (e) => console.log(`mkdir ${JSON.stringify(dir)} recursive=${recursive}: ${e.code} ${e.syscall}`),
              );
            }
            for (const file of ["D:\\.hyperframes-probe.part", "C:\\.hyperframes-probe.part"]) {
              try { fs.writeFileSync(file, "", { flag: "wx" }); fs.rmSync(file); console.log(`write ${file}: ok`); }
              catch (e) { console.log(`write ${file}: ${e.code}`); }
            }
          })();
          '@
          Set-Content -Path probe.js -Value $js
          node probe.js
          whoami /groups | Select-String "Administrators|Mandatory" | Out-String | Write-Host
