name: Windows render verification
permissions:
  contents: read
env:
  HYPERFRAMES_NO_TELEMETRY: "1"
  NO_COLOR: "1"
  HYPERFRAMES_SKIP_SKILLS: "1"
on:
  workflow_dispatch:
jobs:
  zipprobe:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: probe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $root = 'C:\zp'; New-Item -ItemType Directory $root | Out-Null
          Set-Location $root
          npm i --no-audit --no-fund hyperframes@0.9.79 *> npm.log
          $cli = "$root\node_modules\hyperframes\dist\cli.js"
          if (-not (Test-Path $cli)) { Get-ChildItem "$root\node_modules\hyperframes" -Recurse -Depth 2 | Select -First 30 FullName; $cli = (Get-Content "$root\node_modules\hyperframes\package.json" | ConvertFrom-Json).bin.hyperframes; $cli = Join-Path "$root\node_modules\hyperframes" $cli }
          "cli: $cli"
          function NewProj($name) {
            $d = "$root\p\$name"; New-Item -ItemType Directory $d -Force | Out-Null
            Set-Content "$d\index.html" '<!doctype html><html><body><div id="root" data-composition-id="main" data-width="1080" data-height="1920" data-duration="2"><img src="a.png"></div></body></html>'
            [IO.File]::WriteAllBytes("$d\a.png", (New-Object byte[] 2000))
            return $d
          }
          function Probe($name, $d) {
            "===== $name"
            $out = & node $cli cloud render $d --include-outside-files --dry-run --json 2>&1 | Out-String
            "exit=$LASTEXITCODE"
            $out.Substring(0, [Math]::Min(1800, $out.Length))
          }
          $d = NewProj base; Probe base $d

          $d = NewProj locked; [IO.File]::WriteAllBytes("$d\clip.mp4", (New-Object byte[] 5000000))
          $fs = [IO.File]::Open("$d\clip.mp4", 'Open', 'ReadWrite', 'None'); Probe locked $d; $fs.Close()

          $d = NewProj lockedsmall; Set-Content "$d\notes.txt" 'x'
          $fs = [IO.File]::Open("$d\notes.txt", 'Open', 'ReadWrite', 'None'); Probe lockedsmall $d; $fs.Close()

          $d = NewProj lockedsub; New-Item -ItemType Directory "$d\renders" | Out-Null; [IO.File]::WriteAllBytes("$d\renders\out.mp4", (New-Object byte[] 3000))
          $fs = [IO.File]::Open("$d\renders\out.mp4", 'Open', 'ReadWrite', 'None'); Probe lockedsub $d; $fs.Close()

          $d = NewProj brokenlink; New-Item -ItemType SymbolicLink -Path "$d\gone.mp4" -Target 'C:\nope\gone.mp4' | Out-Null; Probe brokenlink $d
          $d = NewProj brokenjunction; New-Item -ItemType Directory C:\tmpj | Out-Null; New-Item -ItemType Junction -Path "$d\media" -Target C:\tmpj | Out-Null; Remove-Item C:\tmpj; Probe brokenjunction $d

          $d = NewProj denydir; New-Item -ItemType Directory "$d\private" | Out-Null; Set-Content "$d\private\x.txt" 'x'
          icacls "$d\private" /deny "Everyone:(RD)" | Out-Null; Probe denydir $d; icacls "$d\private" /remove:d Everyone | Out-Null

          $d = NewProj denyfile; Set-Content "$d\secret.txt" 'x'
          icacls "$d\secret.txt" /deny "Everyone:(R)" | Out-Null; Probe denyfile $d; icacls "$d\secret.txt" /remove:d Everyone | Out-Null

          $d = NewProj denyimg; icacls "$d\a.png" /deny "Everyone:(R)" | Out-Null; Probe denyimg $d; icacls "$d\a.png" /remove:d Everyone | Out-Null

          $d = NewProj nfd; $nfc = "caf" + [char]0x00E9 + ".png"; $nfdn = "cafe" + [char]0x0301 + ".png"
          Set-Content "$d\$nfc" 'a'; Set-Content "$d\$nfdn" 'b'; Probe nfd $d

          $d = NewProj longpath; $deep = $d; 1..14 | % { $deep = "$deep\folder-with-a-long-name-$_" }
          New-Item -ItemType Directory $deep -Force | Out-Null; Set-Content "$deep\clip.txt" 'x'; "deep len: $($deep.Length)"; Probe longpath $d

          $d = NewProj reserved; cmd /c "echo x > \\?\$d\aux.png"; Probe reserved $d
          $d = NewProj trailingdot; cmd /c "echo x > \\?\$d\shot."; Probe trailingdot $d

          $d = NewProj desktopini; Set-Content "$d\desktop.ini" "[.ShellClassInfo]"; attrib +s +h "$d\desktop.ini"; Probe desktopini $d

          $d = NewProj offline; Set-Content "$d\cloud.mp4" 'x'; attrib +o "$d\cloud.mp4"; Probe offline $d

          $d = NewProj appdata; New-Item -ItemType Junction -Path "$d\sysvol" -Target 'C:\System Volume Information' | Out-Null; Probe sysvol $d
