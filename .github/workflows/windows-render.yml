name: Windows render verification

permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  probe:
    name: "watchdog at ${{ matrix.sha }}"
    runs-on: windows-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        sha: [6913c263798]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/windows-watchdog-own-chrome
          fetch-depth: 0
      - name: Check out the commit under test
        shell: pwsh
        run: git checkout ${{ matrix.sha }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Install dependencies
        shell: pwsh
        run: bun install --frozen-lockfile --linker=hoisted
      - name: Build test prerequisites
        shell: pwsh
        run: |
          bun run --filter '@hyperframes/{parsers,lint,studio-server}' build
          bun run --cwd packages/core build
      - name: Watchdog and preview lifecycle tests
        shell: pwsh
        working-directory: packages/cli
        run: bunx vitest run src/browser/windowsChromeWatchdog.test.ts src/commands/previewLifecycle.test.ts --maxWorkers=2 --reporter=verbose
