name: Windows render verification

permissions:
  contents: read

env:
  HYPERFRAMES_NO_TELEMETRY: "1"

on:
  workflow_dispatch:

jobs:
  check-fs-trace:
    name: check fs trace
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install FFmpeg
        uses: ./.github/actions/install-ffmpeg-windows
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Fixture
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force fstrace\project\.hyperframes | Out-Null
          ffmpeg -loglevel error -f lavfi -i testsrc=size=320x180:rate=30 -t 3 -pix_fmt yuv420p fstrace\project\clip.mov
          Copy-Item fstrace\project\clip.mov fstrace\outside.mov
          Copy-Item fstrace\project\clip.mov fstrace\project\.hyperframes\private.mov
      - name: check under fs trace
        shell: pwsh
        run: |
          foreach ($version in @("0.9.91")) {
            $env:HF_TRACE_OUT = "$PWD\fstrace\trace-$version.txt"
            $env:NODE_OPTIONS = "--require $PWD\fstrace\trace.cjs"
            Set-Location fstrace
            npx --yes "hyperframes@$version" check project --snapshots --json --no-cache > "check-$version.json" 2> "check-$version.err"
            "exit $LASTEXITCODE"
            Set-Location ..
            $env:NODE_OPTIONS = ""
            Select-String -Path "fstrace\check-$version.err" -Pattern "capturing finding" | Select-Object -First 2
            "===== trace $version"
            if (Test-Path $env:HF_TRACE_OUT) { Get-Content $env:HF_TRACE_OUT } else { "no trace file" }
          }
