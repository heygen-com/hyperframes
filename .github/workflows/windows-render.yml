name: Windows render verification

on:
  workflow_dispatch:

jobs:
  defender-update-failure:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Same step as the PR, with an update source that cannot answer
        shell: pwsh
        continue-on-error: true
        timeout-minutes: 3
        run: |
          Set-MpPreference -DisableRealtimeMonitoring $true
          try { Update-MpSignature -UpdateSource InternalDefinitionUpdateServer -ErrorAction Stop } catch { "::warning::Defender signatures were not updated before the tests: $_" }
          "reached the end of the step"

      - name: Same step as the PR, normal source
        shell: pwsh
        continue-on-error: true
        timeout-minutes: 3
        run: |
          Set-MpPreference -DisableRealtimeMonitoring $true
          try { Update-MpSignature -ErrorAction Stop } catch { "::warning::Defender signatures were not updated before the tests: $_" }
          "signatures now $((Get-MpComputerStatus).AntivirusSignatureLastUpdated)"

      - name: The job went on
        shell: pwsh
        run: '"next step ran"'
