<!doctype html>
<html lang="en">
  <head><meta charset="UTF-8" /><script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #000; }</style></head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="DUR" data-width="1920" data-height="1080">
      <video id="clip" src="clip.mp4" data-start="0" data-duration="DUR" muted playsinline style="position:absolute;inset:0;width:100%;height:100%"></video>
      <div id="t" style="position:absolute;left:80px;top:80px;width:200px;height:200px;background:#fc0"></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.to("#t", { x: 1500, rotation: 3600, duration: DUR, ease: "none" }, 0);
      window.__timelines = { main: tl };
    </script>
  </body>
</html>
