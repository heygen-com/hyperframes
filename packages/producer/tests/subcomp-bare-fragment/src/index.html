<!doctype html>
<html>
  <head>
    <style>
      html,
      body {
        margin: 0;
        background: #101820;
      }
      [data-composition-id="main"] {
        background: #101820;
        position: relative;
        width: 320px;
        height: 180px;
        overflow: hidden;
      }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.14.2/gsap.min.js"></script>
  </head>
  <body>
    <div data-composition-id="main" data-width="320" data-height="180" data-duration="2">
      <div
        data-composition-id="scene"
        data-composition-src="compositions/scene.html"
        data-start="0"
        data-duration="2"
        style="position: absolute; inset: 0"
      ></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines.main = gsap.timeline({ paused: true }).to({}, { duration: 2 });
    </script>
  </body>
</html>
