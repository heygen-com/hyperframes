<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>HDR HLG Audio Windows</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #000;
      }

      #main {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }

      .hdr-video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      .label {
        position: absolute;
        top: 48px;
        left: 64px;
        padding: 14px 22px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 36px;
        font-weight: 700;
        color: #ffffff;
        background: rgba(0, 0, 0, 0.6);
        border-radius: 8px;
        z-index: 100;
      }
    </style>
  </head>
  <body>
    <div
      id="main"
      data-composition-id="hdr-hlg-audio-windows"
      data-start="0"
      data-duration="6.5"
      data-width="1920"
      data-height="1080"
    >
      <video
        id="wa-video"
        class="clip hdr-video"
        data-start="0"
        data-duration="3"
        data-track-index="0"
        src="hdr-hlg-audio.mp4"
        muted
        playsinline
      ></video>
      <div class="label clip" data-start="0" data-duration="3">A · HLG with audio</div>

      <video
        id="wb-video"
        class="clip hdr-video"
        data-start="3"
        data-duration="3.5"
        data-track-index="0"
        src="hdr-hlg-audio-delayed.mp4"
        muted
        playsinline
      ></video>
      <div class="label clip" data-start="3" data-duration="3.5">B · HLG video 0.5 s after audio</div>
    </div>
  </body>
</html>
