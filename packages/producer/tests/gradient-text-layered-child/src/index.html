<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Gradient text paint layers</title>
    <style>
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        background: #ffffff;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-no-timeline
      data-start="0"
      data-duration="1"
      data-width="1920"
      data-height="1080"
    >
      <div
        id="gradient-scene"
        class="clip"
        data-start="0"
        data-duration="1"
        data-composition-src="compositions/gradient.html"
        data-composition-id="gradient-text"
        data-no-timeline
      ></div>
    </div>
  </body>
</html>
