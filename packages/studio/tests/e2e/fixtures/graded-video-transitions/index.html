<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Graded video dissolve and clip-path wipe</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      html,
      body {
        width: 640px;
        height: 360px;
        margin: 0;
        overflow: hidden;
        background: #000;
      }
      #film {
        position: relative;
        width: 640px;
        height: 360px;
        overflow: hidden;
      }
      video {
        position: absolute;
        inset: 0;
        width: 640px;
        height: 360px;
        object-fit: cover;
      }
      #b {
        opacity: 0;
      }
      #w {
        clip-path: inset(0 100% 0 0);
      }
    </style>
  </head>
  <body>
    <div
      id="film"
      data-composition-id="main"
      data-start="0"
      data-duration="6"
      data-width="640"
      data-height="360"
    >
      <video
        id="a"
        class="clip"
        src="assets/red.mp4"
        muted
        playsinline
        data-start="0"
        data-duration="4"
        data-track-index="0"
        data-color-grading='{"adjust":{"exposure":0.1}}'
      ></video>
      <video
        id="b"
        class="clip"
        src="assets/blue.mp4"
        muted
        playsinline
        data-start="2"
        data-duration="4"
        data-track-index="1"
        data-color-grading='{"adjust":{"exposure":0.1}}'
      ></video>
      <video
        id="w"
        class="clip"
        src="assets/green.mp4"
        muted
        playsinline
        data-start="4"
        data-duration="2"
        data-track-index="2"
        data-color-grading='{"adjust":{"exposure":0.1}}'
      ></video>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#b", { opacity: 0 }, { opacity: 1, duration: 2, ease: "none" }, 2);
      tl.fromTo(
        "#w",
        { clipPath: "inset(0 100% 0 0)" },
        { clipPath: "inset(0 0% 0 0)", duration: 2, ease: "none" },
        4,
      );
      window.__timelines.main = tl;
    </script>
  </body>
</html>
