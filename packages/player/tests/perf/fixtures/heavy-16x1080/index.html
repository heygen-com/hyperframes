<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>perf fixture: autoplaying video feed</title>
    <style>
      :root {
        color-scheme: dark;
        background: #10151c;
        font-family: system-ui, sans-serif;
      }
      body {
        margin: 0;
        padding: 24px;
      }
      #root {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 24px;
        max-width: 1920px;
        margin: 0 auto;
      }
      video {
        display: block;
        width: 100%;
        aspect-ratio: 16 / 9;
        object-fit: cover;
        background: #050714;
        border-radius: 12px;
      }
    </style>
  </head>
  <body>
    <main id="root" data-fps="30" aria-label="Autoplaying video feed"></main>
    <script>
      const root = document.getElementById("root");
      const videos = [];
      for (let track = 0; track < 16; track++) {
        const video = document.createElement("video");
        video.dataset.trackIndex = String(track);
        video.src = "../_media/h264-1080.mp4";
        video.preload = "auto";
        video.muted = true;
        video.autoplay = true;
        video.loop = true;
        video.playsInline = true;
        root.appendChild(video);
        videos.push(video);
      }
      window.__feedPlaybackErrors = [];
      Promise.all(
        videos.map((video) => video.play().catch((error) => {
          window.__feedPlaybackErrors.push(String(error));
        })),
      );
    </script>
  </body>
</html>
