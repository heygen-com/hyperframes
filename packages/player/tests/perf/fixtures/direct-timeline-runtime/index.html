<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Direct GSAP timeline with the runtime</title>
    <script src="/vendor/gsap.min.js"></script>
    <script data-hyperframes-runtime="1" src="/vendor/hyperframe.runtime.iife.js"></script>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-width="1920"
      data-height="1080"
      data-duration="5"
    >
      <div id="box" style="width: 100px; height: 100px; background: #3b82f6"></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.to("#box", { x: 400, duration: 5 });
      window.__timelines = { main: tl };
    </script>
  </body>
</html>
