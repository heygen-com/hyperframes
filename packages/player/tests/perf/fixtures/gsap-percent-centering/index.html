<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
      }
      .centered {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 340px;
        height: 227px;
        translate: -50% -50%;
      }
      .auto {
        position: absolute;
        left: 50%;
        top: 50%;
        translate: -50% -50%;
      }
      .sheet {
        translate: none;
        transform: translate(-50%, -50%);
      }
    </style>
    <script data-hyperframes-runtime="1" src="/vendor/hyperframe.runtime.iife.js"></script>
    <script src="/vendor/gsap.min.js"></script>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-width="1920"
      data-height="1080"
      data-duration="4"
    >
      <div id="target" class="centered"></div>
      <div id="lazy" class="centered"></div>
      <div id="explicit" class="centered"></div>
      <div id="slide" class="centered" style="translate: none; transform: translateX(-100%)"></div>
      <div id="opacity" class="centered"></div>
      <div id="sheet" class="centered sheet"></div>
      <div id="origin" class="centered"></div>
      <div id="read" class="centered"></div>
      <div id="quick" class="centered"></div>
      <div id="boxed" class="centered" style="padding: 10px"></div>
      <div id="offset" class="centered" style="transform: translateY(20px)"></div>
      <span id="inline" style="translate: -50% -50%">Inline</span>
      <div id="hidden" style="display: none">
        <h1 id="hidden-set" class="auto">Hidden title</h1>
        <h1 id="hidden-tween" class="auto">Hidden title</h1>
        <div id="hidden-percent" class="auto" style="width: 40%; height: 20%"></div>
      </div>
      <div id="mover"></div>
      <div
        id="pixels"
        style="
          position: absolute;
          width: 340px;
          height: 227px;
          transform: translate(0px, -113.49px);
        "
      ></div>
    </div>
    <script>
      gsap.set("#target", { x: 40, y: 20 });
      gsap.set("#explicit", { x: 40, y: 20, xPercent: 25, yPercent: -25 });
      gsap.set("#pixels", { x: 40, y: 20 });
      gsap.set("#slide", { x: 0 });
      gsap.set("#opacity", { autoAlpha: 0.5 });
      gsap.set("#sheet", { x: 40, y: 20 });
      gsap.set("#origin", { transformOrigin: "50% 50%" });
      gsap.set("#origin", { x: 40, y: 20 });
      gsap.set("#boxed", { scale: 1 });
      gsap.set("#offset", { scale: 1 });
      gsap.set("#inline", { scale: 1 });
      gsap.set("#hidden-set", { scale: 1 });
      gsap.set("#hidden-percent", { scale: 1 });
      window.__timelines = {
        main: gsap
          .timeline({ paused: true })
          .to("#lazy", { x: 40, y: 20, duration: 4, ease: "none" })
          .to("#hidden-tween", { x: 10, duration: 1 }, 0)
          .to("#mover", { x: 250, duration: 4, ease: "none" }, 0),
      };
    </script>
  </body>
</html>
