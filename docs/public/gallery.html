<script>
  const q = document.getElementById("q");
  const cards = [...document.querySelectorAll(".c")];
  q.addEventListener("input", () => {
    const v = q.value.trim().toLowerCase();
    for (const c of cards) c.hidden = v && !c.dataset.name.includes(v);
  });
</script>
