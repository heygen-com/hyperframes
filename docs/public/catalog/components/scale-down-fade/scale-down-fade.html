<!--
  Scale Down Fade - remocn typography primitive for HyperFrames.

  Paste the markup, CSS and script into a composition. Drive the timeline
  integration from a paused GSAP timeline so renders remain deterministic.

  Variables. The script reads each one, falls back to the declared default on
  anything missing or unrecognised, and writes the result as a custom property
  the CSS below consumes. The timeline recipe stays untouched by them: it keeps
  driving one scale and one blur, and these decide how far that scale overshoots
  and how wide that blur spreads.

    - words (text, default "Quiet confidence"): the words on screen. The text is
      split on whitespace and each word becomes its own span, so the stagger
      picks up as many steps as there are words. Blank or non-text input falls
      back to the default pair.
    - overshoot (subtle | standard | bold, default standard): scales how far
      above final size the words start. subtle covers about a third of the run,
      bold a little over double, in the same time.
    - blur (soft | standard | heavy, default standard): scales the blur radius
      the timeline drives, from a light haze to a full smear.
    - tone (ink | paper | accent, default ink): word colour. ink is near-black
      for light frames, paper near-white for dark ones, accent rides --brand.

  On every default the result is identical to the original: two near-black words
  settling down from 1.08 through a 16px blur.
-->

<div
  class="hf-remocn-scale-down-fade"
  data-composition-variables='[
    { "id": "words", "type": "string", "role": "content", "label": "Words", "description": "Words on screen, split on whitespace so each one gets its own stagger step.", "default": "Quiet confidence" },
    { "id": "overshoot", "type": "enum", "role": "motion", "label": "Overshoot", "description": "Scales how far above final size the words start before they settle.", "default": "standard", "options": [{ "value": "subtle", "label": "Subtle" }, { "value": "standard", "label": "Standard" }, { "value": "bold", "label": "Bold" }] },
    { "id": "blur", "type": "enum", "role": "style", "label": "Blur", "description": "Scales the blur radius the timeline drives, from a light haze to a full smear.", "default": "standard", "options": [{ "value": "soft", "label": "Soft" }, { "value": "standard", "label": "Standard" }, { "value": "heavy", "label": "Heavy" }] },
    { "id": "tone", "type": "enum", "role": "style", "label": "Tone", "description": "Word colour: ink for light frames, paper for dark ones, accent rides --brand.", "default": "ink", "options": [{ "value": "ink", "label": "Ink" }, { "value": "paper", "label": "Paper" }, { "value": "accent", "label": "Accent" }] }
  ]'
><span>Quiet</span><span>confidence</span></div>

<style>
  .hf-remocn-scale-down-fade {
    color: var(--hf-word-color, #18181b);
    font-family: Inter, system-ui, sans-serif;
    font-weight: 900;
    letter-spacing: -0.04em;
  }
  .hf-remocn-scale-down-fade {
    display: inline-flex;
    gap: 12px;
    font-size: 56px;
    line-height: 1;
  }
  .hf-remocn-scale-down-fade span {
    display: inline-block;
    transform: translate(var(--hf-word-x, 0px), var(--hf-word-y, 0px))
      scale(calc(1 + (var(--hf-word-scale, 1) - 1) * var(--hf-word-overshoot, 1)));
    filter: blur(calc(var(--hf-word-blur, 0px) * var(--hf-word-blur-scale, 1)));
    will-change: transform, filter, opacity;
  }
</style>

<script>
  (function () {
    "use strict";

    var vars =
      window.__hyperframes && window.__hyperframes.getVariables
        ? window.__hyperframes.getVariables()
        : {};

    // Unrecognised overrides return to their declared defaults.
    function pick(table, value, fallback) {
      return Object.prototype.hasOwnProperty.call(table, value) ? value : fallback;
    }

    var overshoots = { subtle: 0.35, standard: 1, bold: 2.2 };
    var blurScales = { soft: 0.4, standard: 1, heavy: 2.1 };
    var tones = {
      ink: "#18181b",
      paper: "#fafafa",
      accent: "var(--brand, #34d399)",
    };

    var overshoot = overshoots[pick(overshoots, vars.overshoot, "standard")];
    var blurScale = blurScales[pick(blurScales, vars.blur, "standard")];
    var tone = tones[pick(tones, vars.tone, "ink")];
    var words = (typeof vars.words === "string" ? vars.words : "").split(/\s+/).filter(Boolean);
    if (words.length === 0) words = ["Quiet", "confidence"];

    var roots = document.querySelectorAll(".hf-remocn-scale-down-fade");
    for (var i = 0; i < roots.length; i += 1) {
      var root = roots[i];
      root.style.setProperty("--hf-word-overshoot", String(overshoot));
      root.style.setProperty("--hf-word-blur-scale", String(blurScale));
      root.style.setProperty("--hf-word-color", tone);
      root.textContent = "";
      for (var j = 0; j < words.length; j += 1) {
        var span = document.createElement("span");
        span.textContent = words[j];
        root.appendChild(span);
      }
    }
  })();
</script>

<!--
  Timeline integration:
  tl.fromTo('.hf-remocn-scale-down-fade span', { opacity: 0, '--hf-word-scale': 1.08, '--hf-word-blur': '16px' }, { opacity: 1, '--hf-word-scale': 1, '--hf-word-blur': '0px', duration: 0.52, stagger: 0.05, ease: 'power3.out' }, startTime);
-->
