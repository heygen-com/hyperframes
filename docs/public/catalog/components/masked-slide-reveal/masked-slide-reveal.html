<!--
  Masked Slide Reveal - remocn typography primitive for HyperFrames.

  Paste the markup, CSS and script into a composition. Drive the timeline
  integration from a paused GSAP timeline so renders remain deterministic.

  Variables. The script reads each one, falls back to the declared default on
  anything missing or invalid, and writes the result as a custom property the
  CSS consumes (or, for the words, as the spans themselves). The timeline
  recipe below is untouched by them: it keeps driving one offset, one scale and
  one blur across whatever spans are present.

    - words (text, default Agents compose scenes): whitespace separated words,
      one span each, capped at twelve. The stagger picks up the new count.
    - size (24 to 120 px, default 56): type size of the words.
    - distance (close | standard | far, default standard): scales the slide
      offset. close covers half the run, far nearly double, in the same time.
    - tone (ink | paper | accent, default ink): word colour. ink is near-black
      for light frames, paper near-white for dark ones, accent rides --brand.

  On every default the result is identical to the original: three 56px words in
  near-black sliding up 22px out of the mask.
-->

<div
  class="hf-remocn-masked-slide-reveal"
  data-composition-variables='[
    { "id": "words", "type": "string", "role": "content", "label": "Words", "description": "Whitespace separated words, one per revealed span. Up to twelve.", "default": "Agents compose scenes" },
    { "id": "size", "type": "number", "role": "style", "label": "Size", "description": "Type size of the words in pixels.", "default": 56, "min": 24, "max": 120, "step": 4, "unit": "px" },
    { "id": "distance", "type": "enum", "role": "motion", "label": "Distance", "description": "Scales the slide offset, so the words cover a shorter or longer run in the same time.", "default": "standard", "options": [{ "value": "close", "label": "Close" }, { "value": "standard", "label": "Standard" }, { "value": "far", "label": "Far" }] },
    { "id": "tone", "type": "enum", "role": "style", "label": "Tone", "description": "Word colour: ink for light frames, paper for dark ones, accent rides --brand.", "default": "ink", "options": [{ "value": "ink", "label": "Ink" }, { "value": "paper", "label": "Paper" }, { "value": "accent", "label": "Accent" }] }
  ]'
>
  <span>Agents</span><span>compose</span><span>scenes</span>
</div>

<style>
  .hf-remocn-masked-slide-reveal {
    color: var(--hf-word-color, #18181b);
    font-family: Inter, system-ui, sans-serif;
    font-weight: 900;
    letter-spacing: -0.04em;
  }
  .hf-remocn-masked-slide-reveal {
    display: inline-flex;
    gap: 12px;
    font-size: var(--hf-word-size, 56px);
    line-height: 1;
  }
  .hf-remocn-masked-slide-reveal span {
    display: inline-block;
    transform: translate(
        var(--hf-word-x, 0px),
        calc(var(--hf-word-y, 0px) * var(--hf-word-reach, 1))
      )
      scale(var(--hf-word-scale, 1));
    filter: blur(var(--hf-word-blur, 0px));
    will-change: transform, filter, opacity;
  }
</style>

<script>
  (function () {
    "use strict";

    var vars =
      window.__hyperframes && window.__hyperframes.getVariables
        ? window.__hyperframes.getVariables()
        : {};

    // Anything missing or invalid returns to its declared default.
    var reaches = { close: 0.5, standard: 1, far: 1.85 };
    var tones = {
      ink: "#18181b",
      paper: "#fafafa",
      accent: "var(--brand, #34d399)",
    };

    function pick(table, value, fallback) {
      return Object.prototype.hasOwnProperty.call(table, value) ? value : fallback;
    }

    var words =
      typeof vars.words === "string" ? vars.words.trim().split(/\s+/).slice(0, 12) : [];
    if (!words.length || !words[0]) {
      words = ["Agents", "compose", "scenes"];
    }

    var size = typeof vars.size === "number" || typeof vars.size === "string" ? Number(vars.size) : NaN;
    size = isFinite(size) && size > 0 ? Math.min(120, Math.max(24, size)) : 56;

    var reach = reaches[pick(reaches, vars.distance, "standard")];
    var tone = tones[pick(tones, vars.tone, "ink")];

    var roots = document.querySelectorAll(".hf-remocn-masked-slide-reveal");
    for (var i = 0; i < roots.length; i += 1) {
      roots[i].style.setProperty("--hf-word-size", size + "px");
      roots[i].style.setProperty("--hf-word-reach", String(reach));
      roots[i].style.setProperty("--hf-word-color", tone);
      while (roots[i].firstChild) {
        roots[i].removeChild(roots[i].firstChild);
      }
      for (var j = 0; j < words.length; j += 1) {
        var span = document.createElement("span");
        span.textContent = words[j];
        roots[i].appendChild(span);
      }
    }
  })();
</script>

<!--
  Timeline integration:
  tl.fromTo('.hf-remocn-masked-slide-reveal span', { opacity: 0, '--hf-word-y': '22px', '--hf-word-scale': 0.92, '--hf-word-blur': '5px' }, { opacity: 1, '--hf-word-y': '0px', '--hf-word-scale': 1, '--hf-word-blur': '0px', duration: 0.3, stagger: 0.055, ease: 'power3.out' }, startTime);
-->
