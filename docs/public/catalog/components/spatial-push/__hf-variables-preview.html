<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Spatial Push variables preview</title>
    <style>
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #f7f7f8; }
      #hf-vars-root { position: relative; width: 1920px; height: 1080px; }
      #hf-vars-mount { position: absolute; inset: 0; display: grid; place-items: center; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  </head>
  <body>
    <div id="hf-vars-root" data-composition-id="spatial-push-variables-preview" data-start="0" data-width="1920" data-height="1080" data-duration="5" data-fps="30">
      <div id="hf-vars-mount" class="clip" data-composition-id="spatial-push" data-composition-src="./spatial-push.html" data-start="0" data-duration="5" data-track-index="0" data-width="1920" data-height="1080"></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["spatial-push-variables-preview"] = gsap.timeline({ paused: true });
    </script>
    <script>
      (function () {
        var mount = document.getElementById("hf-vars-mount");
        // The mount is filled asynchronously, and the demo script selects
        // what it fills it with, so it cannot run before then.
        var observer = new MutationObserver(build);
        observer.observe(mount, { childList: true, subtree: true });
        build();
        function build() {
          if (!mount.firstElementChild) return;
          observer.disconnect();

        const tl = gsap.timeline({ paused: true });
        const startTime = 0.5;
        tl.fromTo(
          ".hf-remocn-spatial-push .to",
          { "--hf-clip-right": "100%", "--hf-to-x": "60px", "--hf-to-scale": 1.04 },
          {
            "--hf-clip-right": "0%",
            "--hf-to-x": "0px",
            "--hf-to-scale": 1,
            duration: 0.9,
            ease: "power3.inOut",
          },
          startTime,
        );
        tl.to(
          ".hf-remocn-spatial-push .from",
          {
            "--hf-from-x": "-70px",
            "--hf-from-scale": 0.96,
            "--hf-from-blur": "5px",
            duration: 0.9,
            ease: "power3.inOut",
          },
          startTime,
        );
        tl.fromTo(
          ".hf-remocn-spatial-push .fx",
          { "--hf-fx-x": "-110%" },
          { "--hf-fx-x": "110%", duration: 0.58, ease: "power2.inOut" },
          startTime + 0.18,
        );
        tl.fromTo(
          ".hf-remocn-spatial-push .rgb",
          { "--hf-rgb-opacity": 0, "--hf-rgb-x": "-16px" },
          {
            "--hf-rgb-opacity": 1,
            "--hf-rgb-x": "16px",
            repeat: 3,
            yoyo: true,
            duration: 0.07,
            ease: "steps(1)",
          },
          startTime + 0.32,
        );
        tl.set({}, {}, 5);
        window.__timelines = window.__timelines || {};
        window.__timelines["spatial-push-demo"] = tl;
          var child = window.__timelines["spatial-push-demo"];
          delete window.__timelines["spatial-push-demo"];
          if (!child || typeof child.paused !== "function") return;
          child.paused(false);
          window.__timelines["spatial-push-variables-preview"].add(child, 0);
        }
      })();
    </script>
<script>
  (function () {
    var raw = new URLSearchParams(location.search).get('hfv');
    if (raw === null) return;
    var v;
    try { v = JSON.parse(raw); } catch (e) { return; }
    if (!v || typeof v !== 'object') return;
    window.__hfVariables = v;
    var hosts = document.querySelectorAll('[data-composition-src]');
    for (var i = 0; i < hosts.length; i++) {
      var src = (hosts[i].getAttribute('data-composition-src') || '').split('?')[0];
      if (src.slice(src.lastIndexOf('/') + 1) !== "spatial-push.html") continue;
      hosts[i].setAttribute('data-variable-values', JSON.stringify(v));
    }
  })();
</script>
  </body>
</html>
