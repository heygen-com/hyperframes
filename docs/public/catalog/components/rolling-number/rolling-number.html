<!--
  Rolling Number - remocn typography primitive for HyperFrames.

  Paste the markup, CSS and script into a composition. Drive the timeline
  integration from a paused GSAP timeline so renders remain deterministic.

  Variables. The script reads each one, falls back to the declared default on
  anything missing or unrecognised, then rebuilds one place per character and
  writes the rest as custom properties the CSS above consumes. The timeline
  recipe below is untouched by them: it keeps driving one drop and one blur,
  and these decide what that drop and that blur mean on screen.

    - value (any short number, default "30,658"): the number shown. The script
      rebuilds one rolling place per character, separators included, so the
      stagger keeps reading left to right.
    - travel (close | standard | far, default standard): scales the drop, so
      each place covers half the run or nearly double it in the same time.
      Nothing moves at rest, so this one only shows once the timeline runs.
    - blur (soft | standard | heavy, default standard): scales the blur radius,
      from a light haze to a full smear.
    - tone (ink | paper | accent, default ink): digit colour. ink is near-black
      for light frames, paper near-white for dark ones, accent rides --brand.

  On every default the result is identical to the original: 30,658 dropping
  26px through an 8px blur in near-black.
-->

<div
  class="hf-remocn-rolling-number"
  data-composition-variables='[
    { "id": "value", "type": "string", "role": "content", "label": "Value", "description": "The number to show. One place rolls in per character, so separators count too.", "default": "30,658", "maxLength": 24 },
    { "id": "travel", "type": "enum", "role": "motion", "label": "Travel", "description": "Scales the drop the timeline drives, so each place covers a shorter or longer run in the same time.", "default": "standard", "options": [{ "value": "close", "label": "Close" }, { "value": "standard", "label": "Standard" }, { "value": "far", "label": "Far" }] },
    { "id": "blur", "type": "enum", "role": "style", "label": "Blur", "description": "Scales the blur radius the timeline drives, from a light haze to a full smear.", "default": "standard", "options": [{ "value": "soft", "label": "Soft" }, { "value": "standard", "label": "Standard" }, { "value": "heavy", "label": "Heavy" }] },
    { "id": "tone", "type": "enum", "role": "style", "label": "Tone", "description": "Digit colour: ink for light frames, paper for dark ones, accent rides --brand.", "default": "ink", "options": [{ "value": "ink", "label": "Ink" }, { "value": "paper", "label": "Paper" }, { "value": "accent", "label": "Accent" }] }
  ]'
>
  <span>3</span><span>0</span><span>,</span><span>6</span><span>5</span><span>8</span>
</div>

<style>
  .hf-remocn-rolling-number {
    color: var(--hf-number-color, #18181b);
    font-family: Inter, system-ui, sans-serif;
    font-weight: 900;
    letter-spacing: -0.04em;
  }
  .hf-remocn-rolling-number {
    display: inline-flex;
    gap: 2px;
    font:
      900 74px/1 ui-monospace,
      SFMono-Regular,
      Menlo,
      monospace;
  }
  .hf-remocn-rolling-number span {
    display: inline-block;
    transform: translateY(calc(var(--hf-number-y, 0px) * var(--hf-number-reach, 1)));
    filter: blur(calc(var(--hf-number-blur, 0px) * var(--hf-number-blur-scale, 1)));
  }
</style>

<script>
  (function () {
    "use strict";

    var vars =
      window.__hyperframes && window.__hyperframes.getVariables
        ? window.__hyperframes.getVariables()
        : {};

    // Unrecognised overrides return to their declared defaults.
    var reaches = { close: 0.5, standard: 1, far: 1.85 };
    var blurScales = { soft: 0.45, standard: 1, heavy: 2.2 };
    var tones = {
      ink: "#18181b",
      paper: "#fafafa",
      accent: "var(--brand, #34d399)",
    };

    function pick(table, value, fallback) {
      return Object.prototype.hasOwnProperty.call(table, value) ? value : fallback;
    }

    var reach = reaches[pick(reaches, vars.travel, "standard")];
    var blurScale = blurScales[pick(blurScales, vars.blur, "standard")];
    var tone = tones[pick(tones, vars.tone, "ink")];
    var value =
      typeof vars.value === "string" && vars.value.trim() !== "" ? vars.value.trim() : "30,658";

    var roots = document.querySelectorAll(".hf-remocn-rolling-number");
    for (var i = 0; i < roots.length; i += 1) {
      var root = roots[i];
      root.style.setProperty("--hf-number-reach", String(reach));
      root.style.setProperty("--hf-number-blur-scale", String(blurScale));
      root.style.setProperty("--hf-number-color", tone);
      if (root.getAttribute("data-hf-rolling-number-ready") === "1") continue;
      root.textContent = "";
      for (var c = 0; c < value.length; c += 1) {
        var place = document.createElement("span");
        place.textContent = value.charAt(c);
        root.appendChild(place);
      }
      root.setAttribute("data-hf-rolling-number-ready", "1");
    }
  })();
</script>

<!--
  Timeline integration:
  tl.fromTo('.hf-remocn-rolling-number span', { opacity: 0, '--hf-number-y': '26px', '--hf-number-blur': '8px' }, { opacity: 1, '--hf-number-y': '0px', '--hf-number-blur': '0px', duration: 0.3, stagger: 0.045, ease: 'back.out(1.6)' }, startTime);
-->
