<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Shared Axis Z variables preview</title>
    <style>
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #f4f4f5; }
      #hf-vars-root { position: relative; width: 1920px; height: 1080px; }
      #hf-vars-mount { position: absolute; inset: 0; display: grid; place-items: center; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  </head>
  <body>
    <div id="hf-vars-root" data-composition-id="shared-axis-z-variables-preview" data-start="0" data-width="1920" data-height="1080" data-duration="5" data-fps="30">
      <div id="hf-vars-mount" class="clip" data-composition-id="shared-axis-z" data-composition-src="./shared-axis-z.html" data-start="0" data-duration="5" data-track-index="0" data-width="1920" data-height="1080"></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["shared-axis-z-variables-preview"] = gsap.timeline({ paused: true });
    </script>
    <script>
      (function () {
        var mount = document.getElementById("hf-vars-mount");
        // The mount is filled asynchronously, and the demo script selects
        // what it fills it with, so it cannot run before then.
        var observer = new MutationObserver(build);
        observer.observe(mount, { childList: true, subtree: true });
        build();
        function build() {
          if (!mount.firstElementChild) return;
          observer.disconnect();

        const tl = gsap.timeline({ paused: true });
        const startTime = 0.5;

        // Outgoing panel: zoom out + fade (shared-axis Z departure)
        tl.fromTo(
          ".axis-z-outgoing",
          { opacity: 1, scale: 1 },
          { opacity: 0, scale: 1.18, duration: 0.4, ease: "power2.in" },
          startTime,
        );

        // Incoming panel: zoom in from small + fade (shared-axis Z arrival)
        tl.fromTo(
          ".axis-z-incoming",
          { opacity: 0, scale: 0.82 },
          { opacity: 1, scale: 1, duration: 0.45, ease: "expo.out" },
          startTime + 0.05,
        );

        // Word-by-word reveal on the title
        tl.fromTo(
          ".hf-remocn-shared-axis-z span",
          { opacity: 0, "--hf-word-scale": 0.72 },
          {
            opacity: 1,
            "--hf-word-scale": 1,
            duration: 0.34,
            stagger: 0.06,
            ease: "back.out(1.8)",
          },
          startTime + 0.28,
        );

        tl.set({}, {}, 5);
        window.__timelines = window.__timelines || {};
        window.__timelines["shared-axis-z-demo"] = tl;
          var child = window.__timelines["shared-axis-z-demo"];
          delete window.__timelines["shared-axis-z-demo"];
          if (!child || typeof child.paused !== "function") return;
          child.paused(false);
          window.__timelines["shared-axis-z-variables-preview"].add(child, 0);
        }
      })();
    </script>
<script>
  (function () {
    var raw = new URLSearchParams(location.search).get('hfv');
    if (raw === null) return;
    var v;
    try { v = JSON.parse(raw); } catch (e) { return; }
    if (!v || typeof v !== 'object') return;
    window.__hfVariables = v;
    var hosts = document.querySelectorAll('[data-composition-src]');
    for (var i = 0; i < hosts.length; i++) {
      var src = (hosts[i].getAttribute('data-composition-src') || '').split('?')[0];
      if (src.slice(src.lastIndexOf('/') + 1) !== "shared-axis-z.html") continue;
      hosts[i].setAttribute('data-variable-values', JSON.stringify(v));
    }
  })();
</script>
  </body>
</html>
