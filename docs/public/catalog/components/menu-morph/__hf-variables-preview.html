<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Menu Morph variables preview</title>
    <style>
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #f4f4f5; }
      #hf-vars-root { position: relative; width: 1920px; height: 1080px; }
      #hf-vars-mount { position: absolute; inset: 0; display: grid; place-items: center; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  </head>
  <body>
    <div id="hf-vars-root" data-composition-id="menu-morph-variables-preview" data-start="0" data-width="1920" data-height="1080" data-duration="5" data-fps="30">
      <div id="hf-vars-mount" class="clip" data-composition-id="menu-morph" data-composition-src="./menu-morph.html" data-start="0" data-duration="5" data-track-index="0" data-width="1920" data-height="1080"></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["menu-morph-variables-preview"] = gsap.timeline({ paused: true });
    </script>
    <script>
      (function () {
        var mount = document.getElementById("hf-vars-mount");
        // The mount is filled asynchronously, and the demo script selects
        // what it fills it with, so it cannot run before then.
        var observer = new MutationObserver(build);
        observer.observe(mount, { childList: true, subtree: true });
        build();
        function build() {
          if (!mount.firstElementChild) return;
          observer.disconnect();

        const tl = gsap.timeline({ paused: true });
        tl.fromTo(
          ".hf-transition-menu-button",
          { scale: 0.72, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.34, ease: "back.out(1.8)" },
          0.3,
        );
        tl.to(
          ".hf-transition-menu-button span:nth-child(1)",
          { y: 8, rotation: 45, duration: 0.24, ease: "power2.inOut" },
          0.78,
        );
        tl.to(
          ".hf-transition-menu-button span:nth-child(2)",
          { opacity: 0, duration: 0.18, ease: "power1.out" },
          0.78,
        );
        tl.to(
          ".hf-transition-menu-button span:nth-child(3)",
          { y: -8, rotation: -45, duration: 0.24, ease: "power2.inOut" },
          0.78,
        );
        tl.fromTo(
          ".hf-transition-menu-actions div",
          { y: 28, opacity: 0, scale: 0.86 },
          { y: 0, opacity: 1, scale: 1, duration: 0.26, stagger: 0.06, ease: "back.out(1.6)" },
          0.96,
        );
        tl.set({}, {}, 5);
        window.__timelines = window.__timelines || {};
        window.__timelines["menu-morph-demo"] = tl;
          var child = window.__timelines["menu-morph-demo"];
          delete window.__timelines["menu-morph-demo"];
          if (!child || typeof child.paused !== "function") return;
          child.paused(false);
          window.__timelines["menu-morph-variables-preview"].add(child, 0);
        }
      })();
    </script>
<script>
  (function () {
    var raw = new URLSearchParams(location.search).get('hfv');
    if (raw === null) return;
    var v;
    try { v = JSON.parse(raw); } catch (e) { return; }
    if (!v || typeof v !== 'object') return;
    window.__hfVariables = v;
    var hosts = document.querySelectorAll('[data-composition-src]');
    for (var i = 0; i < hosts.length; i++) {
      var src = (hosts[i].getAttribute('data-composition-src') || '').split('?')[0];
      if (src.slice(src.lastIndexOf('/') + 1) !== "menu-morph.html") continue;
      hosts[i].setAttribute('data-variable-values', JSON.stringify(v));
    }
  })();
</script>
  </body>
</html>
