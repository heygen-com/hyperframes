<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Simulated Cursor variables preview</title>
    <style>
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #ecf1f3; }
      #hf-vars-root { position: relative; width: 1920px; height: 1080px; }
      #hf-vars-mount { position: absolute; inset: 0; display: grid; place-items: center; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  </head>
  <body>
    <div id="hf-vars-root" data-composition-id="simulated-cursor-variables-preview" data-start="0" data-width="1920" data-height="1080" data-duration="5" data-fps="30">
      <div id="hf-vars-mount" class="clip" data-composition-id="simulated-cursor" data-composition-src="./simulated-cursor.html" data-start="0" data-duration="5" data-track-index="0" data-width="1920" data-height="1080"></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["simulated-cursor-variables-preview"] = gsap.timeline({ paused: true });
    </script>
    <script>
      (function () {
        var mount = document.getElementById("hf-vars-mount");
        // The mount is filled asynchronously, and the demo script selects
        // what it fills it with, so it cannot run before then.
        var observer = new MutationObserver(build);
        observer.observe(mount, { childList: true, subtree: true });
        build();
        function build() {
          if (!mount.firstElementChild) return;
          observer.disconnect();

        const tl = gsap.timeline({ paused: true });
        tl.from(".card", { opacity: 0, y: 30, duration: 0.6, ease: "power3.out" }, 0.2);
        tl.to(
          ".hf-simulated-cursor",
          {
            "--hf-cursor-x": "1030px",
            "--hf-cursor-y": "620px",
            duration: 1,
            ease: "power2.inOut",
          },
          1.0,
        );
        tl.fromTo(
          ".hf-simulated-cursor-pulse",
          { opacity: 0.8, scale: 0.2 },
          { opacity: 0, scale: 2.4, duration: 0.45, ease: "power2.out" },
          2.02,
        );
        window.__timelines = window.__timelines || {};
        window.__timelines["simulated-cursor-demo"] = tl;
          var child = window.__timelines["simulated-cursor-demo"];
          delete window.__timelines["simulated-cursor-demo"];
          if (!child || typeof child.paused !== "function") return;
          child.paused(false);
          window.__timelines["simulated-cursor-variables-preview"].add(child, 0);
        }
      })();
    </script>
<script>
  (function () {
    var raw = new URLSearchParams(location.search).get('hfv');
    if (raw === null) return;
    var v;
    try { v = JSON.parse(raw); } catch (e) { return; }
    if (!v || typeof v !== 'object') return;
    window.__hfVariables = v;
    var hosts = document.querySelectorAll('[data-composition-src]');
    for (var i = 0; i < hosts.length; i++) {
      var src = (hosts[i].getAttribute('data-composition-src') || '').split('?')[0];
      if (src.slice(src.lastIndexOf('/') + 1) !== "simulated-cursor.html") continue;
      hosts[i].setAttribute('data-variable-values', JSON.stringify(v));
    }
  })();
</script>
  </body>
</html>
