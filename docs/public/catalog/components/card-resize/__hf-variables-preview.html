<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Card Resize variables preview</title>
    <style>
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #fafafa; }
      #hf-vars-root { position: relative; width: 1920px; height: 1080px; }
      #hf-vars-mount { position: absolute; inset: 0; display: grid; place-items: center; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  </head>
  <body>
    <div id="hf-vars-root" data-composition-id="card-resize-variables-preview" data-start="0" data-width="1920" data-height="1080" data-duration="5" data-fps="30">
      <div id="hf-vars-mount" class="clip" data-composition-id="card-resize" data-composition-src="./card-resize.html" data-start="0" data-duration="5" data-track-index="0" data-width="1920" data-height="1080"></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["card-resize-variables-preview"] = gsap.timeline({ paused: true });
    </script>
    <script>
      (function () {
        var mount = document.getElementById("hf-vars-mount");
        // The mount is filled asynchronously, and the demo script selects
        // what it fills it with, so it cannot run before then.
        var observer = new MutationObserver(build);
        observer.observe(mount, { childList: true, subtree: true });
        build();
        function build() {
          if (!mount.firstElementChild) return;
          observer.disconnect();

        const tl = gsap.timeline({ paused: true });
        tl.fromTo(
          ".hf-transition-card-resize",
          { "--hf-card-w": "330px", "--hf-card-h": "132px", opacity: 0, y: 24 },
          {
            "--hf-card-w": "560px",
            "--hf-card-h": "210px",
            opacity: 1,
            y: 0,
            duration: 0.68,
            ease: "power3.inOut",
          },
          0.35,
        );
        tl.fromTo(
          ".hf-transition-card-copy p",
          { opacity: 0, y: 12 },
          { opacity: 1, y: 0, duration: 0.28, ease: "power2.out" },
          0.82,
        );
        tl.set({}, {}, 5);
        window.__timelines = window.__timelines || {};
        window.__timelines["card-resize-demo"] = tl;
          var child = window.__timelines["card-resize-demo"];
          delete window.__timelines["card-resize-demo"];
          if (!child || typeof child.paused !== "function") return;
          child.paused(false);
          window.__timelines["card-resize-variables-preview"].add(child, 0);
        }
      })();
    </script>
<script>
  (function () {
    var raw = new URLSearchParams(location.search).get('hfv');
    if (raw === null) return;
    var v;
    try { v = JSON.parse(raw); } catch (e) { return; }
    if (!v || typeof v !== 'object') return;
    window.__hfVariables = v;
    var hosts = document.querySelectorAll('[data-composition-src]');
    for (var i = 0; i < hosts.length; i++) {
      var src = (hosts[i].getAttribute('data-composition-src') || '').split('?')[0];
      if (src.slice(src.lastIndexOf('/') + 1) !== "card-resize.html") continue;
      hosts[i].setAttribute('data-variable-values', JSON.stringify(v));
    }
  })();
</script>
  </body>
</html>
