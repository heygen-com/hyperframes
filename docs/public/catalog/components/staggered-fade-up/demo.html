<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Staggered Fade Up - Demo</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }
      #demo {
        width: 1920px;
        height: 1080px;
        display: grid;
        place-items: center;
        background: var(--bg, #f5f5f4);
        font-family: var(--font-body, Inter, system-ui, sans-serif);
      }
      /* ponytail: zoom on .demo-frame (not a GSAP target) to fill ~65% of frame */
      .demo-frame {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 28px;
        padding: 72px 96px;
        zoom: 1.9;
      }
      .demo-label {
        font-size: 13px;
        font-weight: 500;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--muted, #71717a);
      }
      .hf-remocn-staggered-fade-up {
        color: var(--fg, #18181b);
        font-family: var(--font-display, Inter, system-ui, sans-serif);
        font-weight: 900;
        letter-spacing: -0.04em;
      }
      .hf-remocn-staggered-fade-up {
        display: flex;
        flex-wrap: wrap;
        gap: 14px 18px;
        font-size: 72px;
        line-height: 1.05;
        max-width: 680px;
        justify-content: center;
      }
      .hf-remocn-staggered-fade-up span {
        display: inline-block;
        transform: translate(var(--hf-word-x, 0px), var(--hf-word-y, 0px))
          scale(var(--hf-word-scale, 1));
        filter: blur(var(--hf-word-blur, 0px));
        will-change: transform, filter, opacity;
      }
    </style>
  </head>
  <body>
    <div
      id="demo"
      data-composition-id="staggered-fade-up-demo"
      data-start="0"
      data-width="1920"
      data-height="1080"
      data-duration="5"
    >
      <div class="demo-frame">
        <div class="demo-label">staggered fade up</div>
        <div class="hf-remocn-staggered-fade-up">
          <span>Motion</span><span>that</span><span>tells</span><span>a</span><span>story</span
          ><span>one</span><span>word</span><span>at</span><span>a</span><span>time</span>
        </div>
      </div>
      <script>
        const tl = gsap.timeline({ paused: true });
        const startTime = 0.4;
        tl.fromTo(
          ".hf-remocn-staggered-fade-up span",
          { opacity: 0, "--hf-word-y": "28px", "--hf-word-scale": 0.92, "--hf-word-blur": "6px" },
          {
            opacity: 1,
            "--hf-word-y": "0px",
            "--hf-word-scale": 1,
            "--hf-word-blur": "0px",
            duration: 0.4,
            stagger: 0.18,
            ease: "power3.out",
          },
          startTime,
        );
        tl.set({}, {}, 5);
        window.__timelines = window.__timelines || {};
        window.__timelines["staggered-fade-up-demo"] = tl;
      </script>
    </div>
  <script>
  (function () {
    var raw = new URLSearchParams(location.search).get('hfv');
    if (raw === null) return;
    var v;
    try { v = JSON.parse(raw); } catch (e) { return; }
    if (!v || typeof v !== 'object') return;
    window.__hfVariables = v;
    var hosts = document.querySelectorAll('[data-composition-src]');
    for (var i = 0; i < hosts.length; i++) {
      var src = (hosts[i].getAttribute('data-composition-src') || '').split('?')[0];
      if (src.slice(src.lastIndexOf('/') + 1) !== "staggered-fade-up.html") continue;
      hosts[i].setAttribute('data-variable-values', JSON.stringify(v));
    }
  })();
</script>
</body>
</html>
