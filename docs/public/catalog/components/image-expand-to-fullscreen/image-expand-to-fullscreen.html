<!--
  Image Expand to Fullscreen - remocn component ported to HyperFrames authoring format.

  Paste the markup, CSS and script into a composition. Drive the timeline integration
  from a paused GSAP timeline so renders remain deterministic.

  Variables. The script reads each one, falls back to the declared default on anything
  missing or unrecognised, and writes the result as a custom property the CSS above
  consumes. The timeline recipe below is untouched by them.

    - accent (green | blue | violet, default blue): ink of the ring that marks the
      incoming plate. The plates themselves are monochrome placeholder material;
      the ring is the one accent-coloured element. green rides --brand, blue rides
      --accent, violet rides --accent-2, and each falls back to a neutral hairline
      so an unthemed composition renders in black and white.
    - format (wide | square | portrait, default wide): aspect of the tile the transition
      plays inside, 760x428, 560x560 or 428x760.
    - corner (soft | sharp | round, default soft): corner radius of the tile, 30px, 0 or 60px.
    - chroma (off | subtle | standard, default standard): strength of the red and cyan fringe
      that stutters over the wipe. off removes it entirely.

  On every default the result is identical to the original: a 760x428 tile with 30px
  corners, a blue to violet destination plate and a full strength chroma stutter.
-->

<div
  class="hf-remocn-image-expand-to-fullscreen"
  data-composition-variables='[
    { "id": "accent", "type": "enum", "role": "style", "label": "Accent", "description": "Theme token for the ring marking the incoming plate. Green rides --brand, blue --accent, violet --accent-2; each falls back to a neutral hairline.", "default": "blue", "options": [{ "value": "blue", "label": "Blue" }, { "value": "violet", "label": "Violet" }, { "value": "green", "label": "Green" }] },
    { "id": "format", "type": "enum", "role": "layout", "label": "Format", "description": "Aspect of the tile the transition plays inside.", "default": "wide", "options": [{ "value": "wide", "label": "Wide" }, { "value": "square", "label": "Square" }, { "value": "portrait", "label": "Portrait" }] },
    { "id": "corner", "type": "enum", "role": "style", "label": "Corner", "description": "Corner radius of the tile.", "default": "soft", "options": [{ "value": "soft", "label": "Soft" }, { "value": "sharp", "label": "Sharp" }, { "value": "round", "label": "Round" }] },
    { "id": "chroma", "type": "enum", "role": "motion", "label": "Chroma split", "description": "Strength of the red and cyan fringe that stutters over the wipe. Off removes it.", "default": "standard", "options": [{ "value": "off", "label": "Off" }, { "value": "subtle", "label": "Subtle" }, { "value": "standard", "label": "Standard" }] }
  ]'
>
  <div class="scene from">Before</div>
  <div class="scene to">Image Expand to Fullscreen</div>
  <div class="fx"></div>
  <div class="rgb"></div>
</div>

<style>
  .hf-remocn-image-expand-to-fullscreen {
    --hf-accent: var(--accent, rgba(255, 255, 255, 0.28));
    --hf-ink: #111827;
    --hf-l1: rgba(255, 255, 255, 0.72);
    --hf-l3: rgba(255, 255, 255, 0.18);
    --hf-l4: rgba(255, 255, 255, 0.08);
    --hf-hair: rgba(255, 255, 255, 0.14);
    --hf-muted: #6b7280;
    --hf-surface: #ffffff;
    color: var(--hf-ink);
    font-family: Inter, system-ui, sans-serif;
  }
  .hf-remocn-image-expand-to-fullscreen {
    position: relative;
    width: var(--hf-plate-w, 760px);
    height: var(--hf-plate-h, 428px);
    overflow: hidden;
    border-radius: var(--hf-plate-radius, 30px);
    background: #111827;
    box-shadow: 0 28px 80px rgba(15, 23, 42, 0.2);
  }
  .hf-remocn-image-expand-to-fullscreen .scene {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    font-weight: 900;
    font-size: 58px;
    letter-spacing: -0.05em;
    color: #fff;
  }
  .hf-remocn-image-expand-to-fullscreen .from {
    background:
      repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.04) 0 1px, transparent 1px 4px),
      var(--hf-l4);
    transform: translate(var(--hf-from-x, 0px), var(--hf-from-y, 0px))
      scale(var(--hf-from-scale, 1));
    filter: blur(var(--hf-from-blur, 0px));
  }
  .hf-remocn-image-expand-to-fullscreen .to {
    background:
      repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.05) 0 1px, transparent 1px 4px),
      var(--hf-l3);
    box-shadow: inset 0 0 0 2px var(--hf-accent);
    transform: translate(var(--hf-to-x, 0px), var(--hf-to-y, 0px)) scale(var(--hf-to-scale, 1));
    clip-path: inset(
      var(--hf-clip-top, 0%) var(--hf-clip-right, 100%) var(--hf-clip-bottom, 0%)
        var(--hf-clip-left, 0%)
    );
  }
  .hf-remocn-image-expand-to-fullscreen .fx {
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.75), transparent);
    mix-blend-mode: screen;
    transform: translateX(var(--hf-fx-x, -110%));
  }
  .hf-remocn-image-expand-to-fullscreen .rgb {
    position: absolute;
    inset: 0;
    pointer-events: none;
    opacity: calc(var(--hf-rgb-opacity, 0) * var(--hf-rgb-strength, 1));
    background: linear-gradient(
      90deg,
      rgba(239, 68, 68, 0.35),
      transparent,
      rgba(34, 211, 238, 0.35)
    );
    transform: translateX(var(--hf-rgb-x, 0px));
  }
</style>

<script>
  (function () {
    "use strict";

    var vars =
      window.__hyperframes && window.__hyperframes.getVariables
        ? window.__hyperframes.getVariables()
        : {};

    // Unrecognised overrides return to their declared defaults.
    function pick(table, value, fallback) {
      return Object.prototype.hasOwnProperty.call(table, value) ? value : fallback;
    }

    // Theme tokens only. The neutral fallback keeps an unthemed mount monochrome.
    var HAIRLINE = "rgba(255, 255, 255, 0.28)";
    var accents = {
      green: "var(--brand, " + HAIRLINE + ")",
      blue: "var(--accent, " + HAIRLINE + ")",
      violet: "var(--accent-2, " + HAIRLINE + ")",
    };
    var formats = {
      wide: { w: "760px", h: "428px" },
      square: { w: "560px", h: "560px" },
      portrait: { w: "428px", h: "760px" },
    };
    var corners = { soft: "30px", sharp: "0px", round: "60px" };
    var chromas = { off: 0, subtle: 0.4, standard: 1 };

    var accent = accents[pick(accents, vars.accent, "blue")];
    var format = formats[pick(formats, vars.format, "wide")];
    var corner = corners[pick(corners, vars.corner, "soft")];
    var chroma = chromas[pick(chromas, vars.chroma, "standard")];

    var roots = document.querySelectorAll(".hf-remocn-image-expand-to-fullscreen");
    for (var i = 0; i < roots.length; i += 1) {
      roots[i].style.setProperty("--hf-accent", accent);
      roots[i].style.setProperty("--hf-plate-w", format.w);
      roots[i].style.setProperty("--hf-plate-h", format.h);
      roots[i].style.setProperty("--hf-plate-radius", corner);
      roots[i].style.setProperty("--hf-rgb-strength", String(chroma));
    }
  })();
</script>

<!--
  Timeline integration:
  tl.fromTo('.hf-remocn-image-expand-to-fullscreen .to', { '--hf-clip-right': '100%', '--hf-to-x': '60px', '--hf-to-scale': 1.04 }, { '--hf-clip-right': '0%', '--hf-to-x': '0px', '--hf-to-scale': 1, duration: 0.9, ease: 'power3.inOut' }, startTime); tl.to('.hf-remocn-image-expand-to-fullscreen .from', { '--hf-from-x': '-70px', '--hf-from-scale': 0.96, '--hf-from-blur': '5px', duration: 0.9, ease: 'power3.inOut' }, startTime); tl.fromTo('.hf-remocn-image-expand-to-fullscreen .fx', { '--hf-fx-x': '-110%' }, { '--hf-fx-x': '110%', duration: 0.58, ease: 'power2.inOut' }, startTime + 0.18); tl.fromTo('.hf-remocn-image-expand-to-fullscreen .rgb', { '--hf-rgb-opacity': 0, '--hf-rgb-x': '-16px' }, { '--hf-rgb-opacity': 1, '--hf-rgb-x': '16px', repeat: 3, yoyo: true, duration: 0.07, ease: 'steps(1)' }, startTime + 0.32);
-->
