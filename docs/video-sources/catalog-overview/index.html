<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>HyperFrames Catalog overview</title>
    <style>
      html,
      body {
        width: 1920px;
        height: 1080px;
        margin: 0;
        overflow: hidden;
        background: #05070b;
      }

      #catalog-overview {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }

      .catalog-film {
        position: absolute;
        inset: 0;
        width: 1920px;
        height: 1080px;
        object-fit: cover;
      }

      .section-label {
        position: absolute;
        inset: 0;
        box-sizing: border-box;
        display: flex;
        align-items: flex-end;
        justify-content: flex-start;
        padding: 64px;
      }

      .section-label span {
        display: block;
        max-width: 1500px;
        padding: 18px 30px 20px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 22px;
        background: rgba(5, 7, 11, 0.82);
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.28);
        color: #ffffff;
        font-family: ui-sans-serif, system-ui, sans-serif;
        font-size: 54px;
        font-weight: 700;
        line-height: 1.1;
        letter-spacing: -0.025em;
      }
    </style>
  </head>
  <body>
    <main
      id="catalog-overview"
      data-composition-id="catalog-overview"
      data-no-timeline
      data-start="0"
      data-duration="19.25"
      data-fps="60"
      data-width="1920"
      data-height="1080"
    >
      <video
        id="catalog-code-morph"
        class="clip catalog-film"
        src="assets/code-morph.mp4"
        data-start="0"
        data-duration="1.75"
        data-media-start="1.8"
        data-track-index="0"
        muted
        playsinline
      ></video>
      <div
        id="catalog-code-morph-label"
        class="clip section-label"
        data-start="0"
        data-duration="1.75"
        data-track-index="1"
      ><span>Code Animations</span></div>
